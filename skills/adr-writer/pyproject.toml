[project]
name = "adr-writer"
version = "0.1.0"
description = "Deterministic ADR corpus lint (evidence mode + commit gate). Mechanical half of the code/LLM split from harness ADR-0044; the semantic half stays with the adr-reviewer agent."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
