[project]
name = "adr-writer"
version = "0.1.0"
description = "Deterministic ADR corpus lint (evidence mode + commit gate). Mechanical half of the code/LLM split from harness ADR-0044; the semantic half stays with the adr-reviewer agent."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the same explicit select as the root ruff.toml. Without it ruff's defaults (413 rules in 0.16)
# apply, and the gate's verdict shifts with upstream version bumps — the harness owns the check thresholds
# (rationale in the header comment of the root ruff.toml; citation-sync adopted the same pin first, in 2026-08).
# The C901 threshold is 15, same as root. The budget is **pruned, not raised** (ADR-0056; canonical: .claude/verify.md).
# The ANN rules enforce explicit types at boundaries (2026-08-31; rationale and design constraints in ~/.claude/.claude/verify.md).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are not consumed boundaries. Type enforcement applies to production code only
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
