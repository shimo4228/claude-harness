[project]
name = "persona-read-loop"
version = "0.1.0"
description = "Scripts for the persona-read-loop skill: an isolated reader launcher and a count of what each revision added. Stdlib only; pytest is a dev dependency."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Same explicit select as the harness root ruff.toml, so upstream default changes do not move the gate.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are not consumed boundaries. Type enforcement applies to production code only.
"tests/test_*.py" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.environment]
# The tests import the scripts as top-level modules through pytest's `pythonpath = ["scripts"]`. ty does
# not read pytest settings, so it gets the same entry point here — the path really exists, so this is a
# declaration of where imports resolve, not a suppression.
root = [".", "scripts"]
