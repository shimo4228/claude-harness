[project]
name = "readme-writer"
version = "0.2.0"
description = "Human-facing README evidence extractor (deterministic counts and listings, no verdict). The verdict belongs to the fresh-context readme-judge agent, per AKC ADR-0008 Code-LLM Layering (Agent Knowledge Cycle research line)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI / end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する。無指定だと ruff の既定 (0.16 で 413 rule)
# が効き、ゲートの判定が上流の版更新で動く — 検査の閾値は harness 側が所有する
# (根拠は root ruff.toml の冒頭コメント。citation-sync が 2026-08 に同じ pin を先行導入)。
# C901 の閾値は root と同じ 15。予算は **上げずに刈る** (ADR-0056、正本は .claude/verify.md)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
