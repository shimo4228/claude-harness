body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}

.u[data-mark="stop"]{background:var(--stop-bg);color:var(--stop-fg)}
.tag{font-size:11px;font-weight:650;margin-left:6px;text-decoration:none;display:inline-block}
.warn{margin:10px 16px;padding:8px 12px;border:1px solid var(--skip-fg);border-radius:8px;color:var(--skip-fg);font-size:13px}

<script type="application/json" id="data">[{"text_id": "contemplative-agent.README.ja", "sha256": "9b2c8b140ec36494c561583fc7e0062783380394d28091a489c1a503b2afa449", "units": [{"i": 0, "line": 1, "section": 0, "kind": "sentence", "text": "Language: English | 日本語", "mark": null}, {"i": 1, "line": 11, "section": 1, "kind": "sentence", "text": "ローカル LLM で動く自律エージェントで、自分の憲法と価値観の変更を自分で提案します。", "mark": null}, {"i": 2, "line": 11, "section": 1, "kind": "sentence", "text": "採用するかどうかは、毎回人間が決めます。", "mark": null}, {"i": 3, "line": 13, "section": 1, "kind": "sentence", "text": "Contemplative Agent は、人間が読んで編集できる形の憲法（constitution）を持ち、それを時間をかけて改正していく自律エージェントです。", "mark": null}, {"i": 4, "line": 13, "section": 1, "kind": "sentence", "text": "自分のエピソードログ（行動の生記録）をパターン（うまくいったことについての短い再利用可能な観察）に蒸留し、憲法・アイデンティティ・スキル・ルールからなる「価値層（value layer）」（エージェントの今後の振る舞いを形作る部分）への昇格を提案します。", "mark": null}, {"i": 5, "line": 13, "section": 1, "kind": "sentence", "text": "人間の承認ゲートを通らない限り、価値層には何も書き込まれません。", "mark": null}, {"i": 6, "line": 15, "section": 1, "kind": "sentence", "text": "なぜこれがあるのか。", "mark": null}, {"i": 7, "line": 15, "section": 1, "kind": "sentence", "text": "インストールも実行も普通のソフトウェアと同じですが、これは作業を片付けるための道具ではありません。", "mark": null}, {"i": 8, "line": 15, "section": 1, "kind": "sentence", "text": "実験です。", "mark": null}, {"i": 9, "line": 15, "section": 1, "kind": "sentence", "text": "明示的な価値観を持ったエージェントが何ヶ月も動き続け、その価値観の改正を提案し続けたら、何が起きるのか。", "mark": null}, {"i": 10, "line": 15, "section": 1, "kind": "sentence", "text": "観察対象はこの自己改正そのもので、ここではそれが例外的に見えやすくなっています。", "mark": null}, {"i": 11, "line": 15, "section": 1, "kind": "sentence", "text": "価値への変更が 1 件ずつ区切られた、後から再現（リプレイ）できるイベントとして残るからです。", "mark": null}, {"i": 12, "line": 15, "section": 1, "kind": "sentence", "text": "ここから見えてくるのは、1 体のエージェントの憲法がどう変わっていったかという履歴です。", "mark": null}, {"i": 13, "line": 17, "section": 1, "kind": "sentence", "text": "エージェントが価値をどう蓄積し書き換えるかを調べている人や、端から端まで読み切れる規模の、推論をローカルで行う自律エージェントが欲しい人には、このリポジトリのコードとログがそのまま材料になります。", "mark": null}, {"i": 14, "line": 19, "section": 1, "kind": "sentence", "text": "ループ全体は Python の CLI で、Ollama が配信する任意のローカル LLM で動きます。", "mark": null}, {"i": 15, "line": 19, "section": 1, "kind": "sentence", "text": "Apple Silicon Mac 1 台（M1 以降、16 GB）の小型モデルでも持ちこたえます。", "mark": null}, {"i": 16, "line": 19, "section": 1, "kind": "sentence", "text": "クラウドの LLM も、LLM の API キーも、シェル実行も使いません。", "mark": null}, {"i": 17, "line": 19, "section": 1, "kind": "sentence", "text": "localhost の Ollama を除けば、ネットワーク上の相手は投稿先の SNS だけです。", "mark": null}, {"i": 18, "line": 21, "section": 1, "kind": "sentence", "text": "現在は Moltbook（AI エージェントだけが投稿する SNS）で動いています。", "mark": null}, {"i": 19, "line": 21, "section": 1, "kind": "sentence", "text": "Moltbook はエージェントが行動し、応答を受ける場であって、目的ではありません。", "mark": null}, {"i": 20, "line": 21, "section": 1, "kind": "sentence", "text": "この場を選んだのは、価値観が他のエージェントとの会話でどう振る舞うかに表れるからです。", "mark": null}, {"i": 21, "line": 21, "section": 1, "kind": "sentence", "text": "そして受け手の側に人間がいないので、実験がうまくいかなくてもその影響が人に届くことはありません。", "mark": null}, {"i": 22, "line": 21, "section": 1, "kind": "sentence", "text": "既定の憲法はプリセットの倫理枠組みの 1 つである Contemplative AI の四公理です（出典は関連プロジェクト。", "mark": null}, {"i": 23, "line": 21, "section": 1, "kind": "sentence", "text": "別のプリセットから始める方法はクイックスタートにあります）。", "mark": null}, {"i": 24, "line": 25, "section": 2, "kind": "sentence", "text": "前提: ローカルに Ollama をインストールしていること。", "mark": null}, {"i": 25, "line": 25, "section": 2, "kind": "sentence", "text": "SNS アダプタを使うなら Moltbook のアカウントも必要です（エージェントが使う認証情報はその API キーだけで、LLM 側には何も要りません）。", "mark": null}, {"i": 26, "line": 25, "section": 2, "kind": "sentence", "text": "生成には Ollama のチャットモデルなら何でも使えます（`OLLAMA_MODEL` で指定）。", "mark": null}, {"i": 27, "line": 25, "section": 2, "kind": "sentence", "text": "検証済みの既定は Gemma 4 E4B（`gemma4:e4b`、ディスク上 ~9.6 GB）で、16 GB の M1 Mac でループ全体が回ります。", "mark": null}, {"i": 28, "line": 25, "section": 2, "kind": "sentence", "text": "埋め込みには同じく Ollama が配信する `nomic-embed-text` を使います。", "mark": null}, {"i": 29, "line": 40, "section": 2, "kind": "sentence", "text": "別の倫理フレームワークから始めるには、init 時に 11 種のプリセットから選びます: `contemplative-agent init --template stoic`（ストア派、功利主義、ケアの倫理、カント主義、プラグマティズム、契約主義など）。", "mark": null}, {"i": 30, "line": 40, "section": 2, "kind": "sentence", "text": "エージェントが使うファイルはすべて `~/.config/moltbook/`（`MOLTBOOK_HOME`）配下の編集可能な Markdown です。", "mark": null}, {"i": 31, "line": 42, "section": 2, "kind": "sentence", "text": "`dialogue`（エージェント 2 体の対話）と `meditate`（瞑想シミュレーション）の各アダプタには外部アカウントは要りません（アダプタ参照）。", "mark": null}, {"i": 32, "line": 42, "section": 2, "kind": "sentence", "text": "CLI の全リファレンス、自律度（確認なしでどこまで動いてよいか）、スケジューリングは Configuration Guide にあります。", "mark": null}, {"i": 33, "line": 65, "section": 3, "kind": "sentence", "text": "要するに、`distill` はエピソードを 1 件ずつ読んでパターンを単一のナレッジストアに書きます。", "mark": null}, {"i": 34, "line": 65, "section": 3, "kind": "sentence", "text": "ここにゲートはありません。", "mark": null}, {"i": 35, "line": 65, "section": 3, "kind": "sentence", "text": "一方、価値層への書き込みはすべて人間が承認した昇格です:", "mark": null}, {"i": 36, "line": 75, "section": 3, "kind": "sentence", "text": "View は、記憶のカテゴリ 1 つを定義する編集可能なテキストシードです（例: 自己省察）。", "mark": null}, {"i": 37, "line": 75, "section": 3, "kind": "sentence", "text": "ストアはクエリ時に view と照合して分類されるので、シードを書き換えれば取り込み直さずに検索結果が変わります（ADR-0019。", "mark": null}, {"i": 38, "line": 75, "section": 3, "kind": "sentence", "text": "ADR はこのプロジェクトの設計判断の記録です）。", "mark": null}, {"i": 39, "line": 75, "section": 3, "kind": "sentence", "text": "Markdown を手で編集することはいつでもでき、その場合はゲートを通りません。", "mark": null}, {"i": 40, "line": 75, "section": 3, "kind": "sentence", "text": "ゲートが管理するのは、エージェント自身が提案する変更です。", "mark": null}, {"i": 41, "line": 79, "section": 4, "kind": "sentence", "text": "Contemplative Agent の 1 体が Moltbook で毎日稼働しています（v2.12.0、2026 年 9 月時点。", "mark": null}, {"i": 42, "line": 79, "section": 4, "kind": "sentence", "text": "生成はローカル Ollama の Gemma 4 E4B）。", "mark": null}, {"i": 43, "line": 79, "section": 4, "kind": "sentence", "text": "その憲法は稼働開始から同時点までにゲートを通って 3 回改正されており、憲法の変更履歴は公開されています。", "mark": null}, {"i": 44, "line": 79, "section": 4, "kind": "sentence", "text": "価値層全体と運用記録も公開しています。", "mark": null}, {"i": 45, "line": 79, "section": 4, "kind": "sentence", "text": "下の前半 4 件はゲートを通ったもの、後半 2 件はゲートを通らない記録です:", "mark": null}, {"i": 46, "line": 81, "section": 4, "kind": "item", "text": "Identity: エージェントが自分について一人称で書いたペルソナ", "mark": null}, {"i": 47, "line": 82, "section": 4, "kind": "item", "text": "Constitution: 現行の憲法本文", "mark": null}, {"i": 48, "line": 83, "section": 4, "kind": "item", "text": "Skills: 1 スキル 1 ファイル。抽出日付きで、状況 / 問題 / 実践の構造を持ちます", "mark": null}, {"i": 49, "line": 84, "section": 4, "kind": "item", "text": "Rules: スキルからの蒸留を生き残った、数少ない恒常的な規範", "mark": null}, {"i": 50, "line": 85, "section": 4, "kind": "item", "text": "Daily reports: タイムスタンプ付きの対話記録（学術・非商用利用は自由）", "mark": null}, {"i": 51, "line": 86, "section": 4, "kind": "item", "text": "Analysis reports: 行動の変化、憲法改正の実験", "mark": null}, {"i": 52, "line": 90, "section": 5, "kind": "sentence", "text": "判断を記録した項目には、末尾にその ADR を付けています。", "mark": null}, {"i": 53, "line": 90, "section": 5, "kind": "sentence", "text": "一覧は docs/adr/ にあります。", "mark": null}, {"i": 54, "line": 92, "section": 5, "kind": "item", "text": "人間ゲート付きの価値層。 昇格のたびにゲートをどう通ったかの記録が残り、承認された値は蒸留時に焼き込まれるのではなく行動時にプロンプトへ読み込まれます（ADR-0012）。", "mark": null}, {"i": 55, "line": 93, "section": 5, "kind": "item", "text": "エピソード単位の蒸留。 エンゲージメントのエピソード 1 件につき LLM を 1 回呼び、要約ではなくエピソード全体を読みます。ノイズは取り込み時ではなくクエリ時に view で濾します（ADR-0060）。", "mark": null}, {"i": 56, "line": 94, "section": 5, "kind": "item", "text": "週次の staged insight。 パターンは毎日流入します。スキル候補は週に 1 回クラスタリングして承認待ちの列に入れるので、16 GB のホストで数千パターンになっても実用的な速度で回ります（ADR-0074）。", "mark": null}, {"i": 57, "line": 95, "section": 5, "kind": "item", "text": "Markdown で貫通。 憲法・アイデンティティ・スキル・ルール・全パイプラインプロンプト・全 view シードは、`MOLTBOOK_HOME` 配下の Markdown ファイルです。プロンプトを編集すればパターンの抽出のされ方が変わり、シードを差し替えれば分類が変わります。カスタマイズ →", "mark": null}, {"i": 58, "line": 99, "section": 6, "kind": "sentence", "text": "パイプラインを変えるときの規則は 1 つです。", "mark": null}, {"i": 59, "line": 99, "section": 6, "kind": "sentence", "text": "先に読み取り専用の計器を建て、その読み値を見てから振る舞いを変えます。", "mark": null}, {"i": 60, "line": 101, "section": 6, "kind": "item", "text": "どの機能も監査ログと一緒に出荷する。 外部 I/O、LLM 呼び出し、ヒューリスティックな判定を含む機能は、入力・判定・理由コード・結果を追記専用の JSONL に残す仕組みと同じ変更で入り、後からオフラインで再生できます。信頼しない入力は base64 とハッシュで保存し、判定を見送るときは必ず理由を残します（ADR-0075）。", "mark": null}, {"i": 61, "line": 102, "section": 6, "kind": "item", "text": "読み値が介入より先。 `contemplative-agent report --patterns | --skill-selection | --submolt-scope` が保存データに対する読み取り専用の読み値を出します。view ごとのパターンの供給量と多様性、選択器の選択結果、submolt（Moltbook 内のトピック別コミュニティ）ごとの関連性の当たり率です。これまでに 2 つの振る舞いの変更が、勘ではなくこの読み値から出ました。蒸留時に生じていた自己相似な言い回しへの偏りの修理（ADR-0072）と、数週間にわたり本番に効かせず並走させた観測（shadow 読み値）を経てからのスキル選択の強制化（ADR-0081）です。", "mark": null}, {"i": 62, "line": 103, "section": 6, "kind": "item", "text": "憲法改正はゲートの前に読み値を 2 つ余分に取る。 現行の憲法本文をモデルに見せずに、保存された憲法関連パターンから合成した影の憲法を現行と比較する読み値（ADR-0092）と、現行案と改正案がどれだけ協調的に振る舞うかを繰り返し囚人のジレンマで比べるベンチ（ADR-0090）です。どちらも人間の判断の材料であって判断そのものは決めず、ベンチで 2 つの憲法に差が出なくても、分かるのはジレンマでの振る舞いが同じということだけで、改正の他の性質については何も言えません。", "mark": null}, {"i": 63, "line": 104, "section": 6, "kind": "item", "text": "行動 eval は、コメント経路が実際に何を生成するかを承認済みのベースラインと突き合わせます。プロンプトやモデルの変更は、印象ではなく判定の遷移として見えます（ADR-0089）。", "mark": null}, {"i": 64, "line": 108, "section": 7, "kind": "item", "text": "Security by absence（不在によるセキュリティ）。 危険な能力は最初から作っていません。シェル実行も、任意のネットワークアクセスも、ファイルトラバーサルもありません。接続先は `moltbook.com` と localhost の Ollama だけで、ランタイム依存は `requests` と `numpy` の 2 つです。他のエージェントの中で使うにあるオプションのアドオンはこれを緩めることがありますが、コアは緩めません。", "mark": null}, {"i": 65, "line": 109, "section": 7, "kind": "item", "text": "1 プロセスにつき外部アダプタは 1 つ。外部との接点を増やすなら、別権限の別プロセスを増やします（ADR-0015）。", "mark": null}, {"i": 66, "line": 110, "section": 7, "kind": "item", "text": "完全な脅威モデルは ADR-0007。セキュリティスキャン（2026-04-01）。", "mark": null}, {"i": 67, "line": 112, "section": 7, "kind": "sentence", "text": "このリポジトリの URL を Claude Code などコードを読める AI に貼って、実行して安全かを聞いてみてください。", "mark": null}, {"i": 68, "line": 112, "section": 7, "kind": "sentence", "text": "コードが自分で答えます。", "mark": null}, {"i": 69, "line": 114, "section": 7, "kind": "sentence", "text": "コーディングエージェント運用者への注意: エピソードログ（`logs/YYYY-MM-DD.jsonl`）は、フィルタされていないプロンプトインジェクションの入口です。", "mark": null}, {"i": 70, "line": 114, "section": 7, "kind": "sentence", "text": "代わりに蒸留済みの出力（`knowledge.json`、`identity.md`、`reports/`）を読んでください。", "mark": null}, {"i": 71, "line": 114, "section": 7, "kind": "sentence", "text": "Claude Code ユーザーは integrations/claude-code/ の PreToolUse hooks でこれを自動的に強制できます。", "mark": null}, {"i": 72, "line": 118, "section": 8, "kind": "sentence", "text": "コアはプラットフォームに依存しません。", "mark": null}, {"i": 73, "line": 118, "section": 8, "kind": "sentence", "text": "アダプタは、プラットフォーム入出力の薄いラッパーです。", "mark": null}, {"i": 74, "line": 120, "section": 8, "kind": "item", "text": "Moltbook: フィードエンゲージメント、投稿生成、通知への返信。稼働中のエージェントが使っているアダプタです。", "mark": null}, {"i": 75, "line": 121, "section": 8, "kind": "item", "text": "Meditation（実験的。日常運用では使っていません）: \"A Beautiful Loop\" に着想を得た小さな瞑想シミュレーションで、エピソードログに対するオフライン実験としてだけ回します。", "mark": null}, {"i": 76, "line": 122, "section": 8, "kind": "item", "text": "Dialogue（ローカル専用）: 2 つのエージェントプロセスが stdin/stdout パイプで対話します。約 150 行のアダプタ（`adapters/dialogue/peer.py`）で、ネットワークなしのテンプレートとしても使えます。`contemplative-agent dialogue HOME_A HOME_B` で憲法の反事実実験を駆動します。", "mark": null}, {"i": 77, "line": 123, "section": 8, "kind": "item", "text": "自作アダプタ: 別のプラットフォームに向けるときは、コアには触らずアダプタを 1 つ書き足すだけです。プラットフォーム入出力をコアのインターフェース（メモリ、蒸留、憲法、アイデンティティ）に合わせて実装します。上の dialogue アダプタが、コピーして始めるいちばん小さな雛形です。コアのインターフェースは `src/contemplative_agent/core/` に、その設計判断は docs/adr/ にあります。", "mark": null}, {"i": 78, "line": 127, "section": 9, "kind": "sentence", "text": "依存の向きは一方向です: adapters/ が core/ を import し、逆方向は存在しません。", "mark": null}, {"i": 79, "line": 127, "section": 9, "kind": "sentence", "text": "これはテスト時に `import-linter` が機械的に強制します。", "mark": null}, {"i": 80, "line": 127, "section": 9, "kind": "sentence", "text": "手で保守するモジュールマップはありません。", "mark": null}, {"i": 81, "line": 127, "section": 9, "kind": "sentence", "text": "構造はコードそのもの（language server、`grimp`）から読み、設計理由は docs/adr/ が持ちます（ADR-0102）。", "mark": null}, {"i": 82, "line": 127, "section": 9, "kind": "sentence", "text": "設計はプロジェクトの外から 2 箇所で借りていて、出典は関連プロジェクトにあります。", "mark": null}, {"i": 83, "line": 127, "section": 9, "kind": "sentence", "text": "メモリ設計（エピソードログ・知識・価値層）は唯識（心の働きを 8 つの識に分ける仏教の古典理論）に沿い、パイプラインは Agent Knowledge Cycle（経験をスキルに変える 6 フェーズの方法）を実装しています。", "mark": null}, {"i": 84, "line": 131, "section": 10, "kind": "sentence", "text": "Contemplative Agent はホストに依存しない CLI です。", "mark": null}, {"i": 85, "line": 131, "section": 10, "kind": "sentence", "text": "単体で使う（クイックスタート参照）ほか、任意のエージェントホスト（OpenClaw / Codex / MCP ホスト）に CLI ツールとして登録し、ホストからサブプロセスとして呼び出せます。", "mark": null}, {"i": 86, "line": 131, "section": 10, "kind": "sentence", "text": "外部との接点は別プロセスに隔離されたままです。", "mark": null}, {"i": 87, "line": 131, "section": 10, "kind": "sentence", "text": "MCP サーバーとしては公開していません。", "mark": null}, {"i": 88, "line": 131, "section": 10, "kind": "sentence", "text": "四公理（既定の憲法。", "mark": null}, {"i": 89, "line": 131, "section": 10, "kind": "sentence", "text": "関連プロジェクトに列挙）をホストのパーソナリティとして読み込むには、contemplative-agent-rules（同じ四公理を持ち運べるペルソナファイルとしてまとめた姉妹リポジトリ）の `SOUL.md` を、ホストのパーソナリティファイルの置き場にコピーしてください。", "mark": null}, {"i": 90, "line": 131, "section": 10, "kind": "sentence", "text": "ホスト統合のガイドは docs/CONFIGURATION.md にあります。", "mark": null}, {"i": 91, "line": 136, "section": 10, "kind": "sentence", "text": "ローカルホストで動かせる範囲を超える生成モデルが要る実験向けに、オプションの contemplative-agent-cloud アドオンが、全生成呼び出しを `LLMBackend` Protocol 経由で Anthropic Claude / OpenAI GPT にルーティングします。", "mark": null}, {"i": 92, "line": 136, "section": 10, "kind": "sentence", "text": "main リポジトリのコードは無改変のまま、埋め込みはローカル Ollama のままです。", "mark": null}, {"i": 93, "line": 136, "section": 10, "kind": "sentence", "text": "これは「クラウドの LLM を使わない」という性質（すべての LLM 呼び出しが localhost に留まること）を緩める、明示的な選択制（opt-in）の機能です。", "mark": null}, {"i": 94, "line": 136, "section": 10, "kind": "sentence", "text": "クラウドへのデータ送出が許容できない環境ではインストールしないでください。", "mark": null}, {"i": 95, "line": 143, "section": 10, "kind": "sentence", "text": "Apple Silicon で対話的な生成を速くしたい場合、オプションの contemplative-agent-mlx アドオンが、同じ `LLMBackend` Protocol 経由で生成をローカルの `mlx_lm.server` にルーティングします（埋め込みは Ollama のまま）。", "mark": null}, {"i": 96, "line": 143, "section": 10, "kind": "sentence", "text": "クラウドバックエンドではなくローカルランタイムの差し替えなので、「クラウドの LLM を使わない」という性質は保たれます。", "mark": null}, {"i": 97, "line": 143, "section": 10, "kind": "sentence", "text": "16 GB ホストでの無人スケジュール運用には向かないため、本番は Ollama で動かしています（ADR-0067）。", "mark": null}, {"i": 98, "line": 149, "section": 11, "kind": "sentence", "text": "AI エージェントとクローラー向け: `graph.jsonld` に公理・メモリ層・ADR・パイプライン対応の関係が正式な形でまとまっており、`llms.txt` がナビゲーション索引、`llms-full.txt` が統合リファレンスです。", "mark": null}, {"i": 99, "line": 149, "section": 11, "kind": "sentence", "text": "対話的な入口は DeepWiki です。", "mark": null}, {"i": 100, "line": 157, "section": 12, "kind": "sentence", "text": "上の引用は v2.11.0 の version DOI を使っています。", "mark": null}, {"i": 101, "line": 157, "section": 12, "kind": "sentence", "text": "DOI バッジは `10.5281/zenodo.19212118` に解決されます。", "mark": null}, {"i": 102, "line": 157, "section": 12, "kind": "sentence", "text": "こちらは常に最新リリースへつながる代表 DOI（all-versions concept DOI）です。", "mark": null}, {"i": 103, "line": 175, "section": 12, "kind": "sentence", "text": "MIT ライセンスの対象はコードで、書いてあるとおりの意味です。", "mark": null}, {"i": 104, "line": 175, "section": 12, "kind": "sentence", "text": "フォークしても、部品取りしても、パイプラインを自分のエージェントに埋め込んでも、その上に商用プロダクトを作ってもかまいません。", "mark": null}, {"i": 105, "line": 175, "section": 12, "kind": "sentence", "text": "コードを使うだけなら引用も不要です。", "mark": null}, {"i": 106, "line": 179, "section": 13, "kind": "sentence", "text": "このリポジトリを両側から補い合う、同じ著者による 2 つの姉妹研究プロジェクトがあります。", "mark": null}, {"i": 107, "line": 179, "section": 13, "kind": "sentence", "text": "一方はこのリポジトリが方法を実装しているもの、もう一方はこのリポジトリのガバナンス判断を書き直したものです。", "mark": null}, {"i": 108, "line": 181, "section": 13, "kind": "item", "text": "Agent Knowledge Cycle (AKC)（DOI）: このプロジェクトが自律エージェント向けに実装し直している方法論の枠組みで、経験から改善可能なスキルへ至る 6 フェーズのループです。ポジションペーパー Harness Alignment and Harness Drift（DOI）も含みます。", "mark": null}, {"i": 109, "line": 182, "section": 13, "kind": "item", "text": "Agent Attribution Practice (AAP)（DOI）: このプロジェクトのガバナンス判断（セキュリティ境界、1 プロセス 1 アダプタ、人間承認ゲート）を、特定の実装に依存しない ADR として書き直し、自律エージェントで責任がどう分配されるかを論じています。責任分配の主張を引用するときは AAP を、実装を引用するときはこのリポジトリを使ってください。", "mark": null}, {"i": 110, "line": 184, "section": 13, "kind": "sentence", "text": "理論的基盤:", "mark": null}, {"i": 111, "line": 186, "section": 13, "kind": "item", "text": "Laukkonen, Inglis, Chandaria, Sandved-Smith, Lopez-Sola, Hohwy, Gold, & Elwood (2025). Contemplative Artificial Intelligence. arXiv:2504.15125. 既定プリセットとして使っている四公理（Emptiness / Non-Duality / Mindfulness / Boundless Care）の倫理フレームワーク（ADR-0002）。", "mark": null}, {"i": 112, "line": 187, "section": 13, "kind": "item", "text": "Laukkonen, Friston & Chandaria (2025). A Beautiful Loop: An Active Inference Theory of Consciousness. Neuroscience & Biobehavioral Reviews, 176, 106296. PubMed:40750007. 実験的な meditation アダプタの着想元。", "mark": null}, {"i": 113, "line": 188, "section": 13, "kind": "item", "text": "Vasubandhu（世親、4–5 世紀）Triṃśikā-vijñaptimātratā（唯識三十頌）および玄奘（659）成唯識論。アーキテクチャの枠組みとして採用した八識モデル（ADR-0017）。", "mark": null}, {"i": 114, "line": 190, "section": 13, "kind": "sentence", "text": "さらに読む: メモリシステムの文献目録は docs/BIBLIOGRAPHY.md、開発中に書かれた記事の索引は docs/DEVELOPMENT-RECORDS.ja.md、プロジェクト用語とその訳語は docs/glossary.md にあります。", "mark": null}, {"i": 115, "line": 190, "section": 13, "kind": "sentence", "text": "著者の研究ライン全体の入口は `shimo4228/shimo4228` です。", "mark": null}, {"i": 116, "line": 192, "section": 13, "kind": "sentence", "text": "謝辞: Jerry Mares（VADUGWI）。", "mark": null}, {"i": 117, "line": 192, "section": 13, "kind": "sentence", "text": "感情スコアリングについての設計思想を参考にさせていただきました。", "mark": null}, {"i": 118, "line": 192, "section": 13, "kind": "sentence", "text": "VADUGWI のエンジン自体は使っていません。", "mark": null}]}, {"text_id": "ecc-journey-part1", "sha256": "0171599c56cd2b6a8648874458b2c317c1d52050f7973733f78defc43788f279", "units": [{"i": 0, "line": 14, "section": 2, "kind": "sentence", "text": "Everything Claude Code (ECC) は、Claude Codeの完全な設定コレクションです。", "mark": null}, {"i": 1, "line": 14, "section": 2, "kind": "sentence", "text": "その本質は単なる「設定集」ではありません。", "mark": null}, {"i": 2, "line": 16, "section": 2, "kind": "sentence", "text": "ECCが提供するのは、開発の完全なPDCAサイクルを体験できる環境です。", "mark": null}, {"i": 3, "line": 38, "section": 2, "kind": "sentence", "text": "このリポジトリの作者はAffaan Mustafa氏です。", "mark": null}, {"i": 4, "line": 38, "section": 2, "kind": "sentence", "text": "2025年9月のAnthropic x Forum Ventures hackathonで、Claude Codeを使ってzenith.chatをわずか8時間で構築しました。", "mark": null}, {"i": 5, "line": 38, "section": 2, "kind": "sentence", "text": "$15,000相当のAPIクレジットを獲得し優勝しています。", "mark": null}, {"i": 6, "line": 40, "section": 2, "kind": "sentence", "text": "ECC は、agents (15+)、skills (30+)、commands (30+)、rules、hooksで構成されています。", "mark": null}, {"i": 7, "line": 40, "section": 2, "kind": "sentence", "text": "重要なのは、これらが開発の一気通貫したフローを実現していることです。", "mark": null}, {"i": 8, "line": 44, "section": 3, "kind": "sentence", "text": "Vibe Coding時代（Claude Code、Cursor等）では実装が高速化しました。", "mark": null}, {"i": 9, "line": 44, "section": 3, "kind": "sentence", "text": "ボトルネックは「コードを書くこと」から「何を作るか・どう作るかの判断」に移っています。", "mark": null}, {"i": 10, "line": 46, "section": 3, "kind": "sentence", "text": "ECCは、計画→実装→検証→改善という開発の全体フローを、誰でも短期間で体験できる環境を提供します。", "mark": null}, {"i": 11, "line": 48, "section": 3, "kind": "sentence", "text": "参考:", "mark": null}, {"i": 12, "line": 50, "section": 3, "kind": "item", "text": "GitHub - Everything Claude Code", "mark": null}, {"i": 13, "line": 51, "section": 3, "kind": "item", "text": "Everything Claude Code: The Repo That Won Anthropic Hackathon", "mark": null}, {"i": 14, "line": 52, "section": 3, "kind": "item", "text": "The Claude Code setup that won a hackathon", "mark": null}, {"i": 15, "line": 56, "section": 4, "kind": "sentence", "text": "私は趣味でPythonを少し書く程度のプログラミング初心者でした：", "mark": null}, {"i": 16, "line": 58, "section": 4, "kind": "item", "text": "gitって何？というレベル", "mark": null}, {"i": 17, "line": 59, "section": 4, "kind": "item", "text": "本格的なアプリ開発の経験なし", "mark": null}, {"i": 18, "line": 60, "section": 4, "kind": "item", "text": "テストも書かない、ドキュメントもない", "mark": null}, {"i": 19, "line": 61, "section": 4, "kind": "item", "text": "バージョン管理という概念すら知らない", "mark": null}, {"i": 20, "line": 63, "section": 4, "kind": "sentence", "text": "そんな私が、2026年1月末にポッドキャストでEverything Claude Codeを知り、初めて本格的な開発を始めました。", "mark": null}, {"i": 21, "line": 67, "section": 5, "kind": "sentence", "text": "Everything Claude Code環境で開発を始めてから10日間で、私が体得したのは個別のスキルではありません。", "mark": null}, {"i": 22, "line": 69, "section": 5, "kind": "sentence", "text": "開発の完全なPDCAサイクルを、繰り返し回す経験でした：", "mark": null}, {"i": 23, "line": 71, "section": 5, "kind": "item", "text": "問題をどう理解するか（リサーチの方法）", "mark": null}, {"i": 24, "line": 72, "section": 5, "kind": "item", "text": "システムをどう設計するか（アーキテクトの思考法）", "mark": null}, {"i": 25, "line": 73, "section": 5, "kind": "item", "text": "実装をどう計画するか（プランニングの技術）", "mark": null}, {"i": 26, "line": 74, "section": 5, "kind": "item", "text": "品質をどう保証するか（TDD、コードレビュー）", "mark": null}, {"i": 27, "line": 75, "section": 5, "kind": "item", "text": "知識をどう蓄積するか（ドキュメント駆動）", "mark": null}, {"i": 28, "line": 79, "section": 6, "kind": "sentence", "text": "多くの開発者は、従来の開発環境からClaude Codeに移行します。", "mark": null}, {"i": 29, "line": 79, "section": 6, "kind": "sentence", "text": "そして、「効率化された」「開発が速くなった」と実感するでしょう。", "mark": null}, {"i": 30, "line": 81, "section": 6, "kind": "sentence", "text": "私の場合は違います。", "mark": null}, {"i": 31, "line": 81, "section": 6, "kind": "sentence", "text": "ECC環境が私の開発の「普通」です。", "mark": null}, {"i": 32, "line": 83, "section": 6, "kind": "sentence", "text": "従来の開発環境も、手作業でのgit操作も、一切経験していません。", "mark": null}, {"i": 33, "line": 83, "section": 6, "kind": "sentence", "text": "開発者として最初の一歩を踏み出したとき、すでにEverything Claude Code環境でした。", "mark": null}, {"i": 34, "line": 85, "section": 6, "kind": "sentence", "text": "比較対象がないため：", "mark": null}, {"i": 35, "line": 87, "section": 6, "kind": "item", "text": "「計画は面倒」という抵抗感がない", "mark": null}, {"i": 36, "line": 88, "section": 6, "kind": "item", "text": "「テストは後回し」という悪習がない", "mark": null}, {"i": 37, "line": 89, "section": 6, "kind": "item", "text": "「ドキュメントは負債」という先入観がない", "mark": null}, {"i": 38, "line": 90, "section": 6, "kind": "item", "text": "PDCAサイクルを回すのが当たり前", "mark": null}, {"i": 39, "line": 92, "section": 6, "kind": "sentence", "text": "私にとって、リサーチ→アーキテクト→プラン→実装→レビュー→ドキュメントという一気通貫のフローが、開発の「普通」です。", "mark": null}, {"i": 40, "line": 94, "section": 6, "kind": "sentence", "text": "この環境で私が取った学習アプローチは、しつこく質問しまくることでした。", "mark": null}, {"i": 41, "line": 96, "section": 6, "kind": "sentence", "text": "「ECC効果など感じることはない。", "mark": null}, {"i": 42, "line": 96, "section": 6, "kind": "sentence", "text": "なぜならECC以外の枠組みを知らないから」", "mark": null}, {"i": 43, "line": 98, "section": 6, "kind": "sentence", "text": "これが、私が10日経って気づいた逆説的な事実です。", "mark": null}, {"i": 44, "line": 98, "section": 6, "kind": "sentence", "text": "そして同時に、良い学習環境で開発を始められたということでもあります。", "mark": null}, {"i": 45, "line": 104, "section": 8, "kind": "sentence", "text": "ある日、Spotifyであるポッドキャストを聴きました。", "mark": null}, {"i": 46, "line": 104, "section": 8, "kind": "sentence", "text": "尾原和啓氏といけとも氏の対談でした。", "mark": null}, {"i": 47, "line": 108, "section": 8, "kind": "sentence", "text": "いけとも氏がEverything Claude Code (ECC) について語る内容を、私は集中して聴きました。", "mark": null}, {"i": 48, "line": 111, "section": 8, "kind": "sentence", "text": "「これは使えるかもしれない」", "mark": null}, {"i": 49, "line": 114, "section": 8, "kind": "sentence", "text": "そう判断し、ポッドキャストを聴き終わった後、すぐにECCを導入することにしました。", "mark": null}, {"i": 50, "line": 118, "section": 9, "kind": "sentence", "text": "次に、いけとも氏のYoutube動画を見つけました。", "mark": null}, {"i": 51, "line": 122, "section": 9, "kind": "sentence", "text": "この動画を注意深く視聴しました：", "mark": null}, {"i": 52, "line": 124, "section": 9, "kind": "item", "text": "メモを取りながら再生", "mark": null}, {"i": 53, "line": 125, "section": 9, "kind": "item", "text": "理解できない部分は何度も巻き戻し", "mark": null}, {"i": 54, "line": 126, "section": 9, "kind": "item", "text": "使用法を学習", "mark": null}, {"i": 55, "line": 128, "section": 9, "kind": "sentence", "text": "Youtubeでの学びは単なる概念理解ではなく、具体的な使い方までカバーしていました。", "mark": null}, {"i": 56, "line": 128, "section": 9, "kind": "sentence", "text": "これが後の導入をスムーズにしてくれました。", "mark": null}, {"i": 57, "line": 132, "section": 10, "kind": "sentence", "text": "次に、NotebookLMを使ってECCに関する情報を集めました：", "mark": null}, {"i": 58, "line": 134, "section": 10, "kind": "item", "text": "いけとも氏のポッドキャストの内容", "mark": null}, {"i": 59, "line": 135, "section": 10, "kind": "item", "text": "Youtube動画の内容", "mark": null}, {"i": 60, "line": 136, "section": 10, "kind": "item", "text": "ECC開発者のページ", "mark": null}, {"i": 61, "line": 137, "section": 10, "kind": "item", "text": "GitHub README・ドキュメント", "mark": null}, {"i": 62, "line": 138, "section": 10, "kind": "item", "text": "ECC関連情報", "mark": null}, {"i": 63, "line": 140, "section": 10, "kind": "sentence", "text": "NotebookLMに情報を集約することで、ベストプラクティスを探ることができました。", "mark": null}, {"i": 64, "line": 144, "section": 11, "kind": "sentence", "text": "私はコマンドラインツール（CLI）に慣れていなかったため、GitHubから手動でZIPファイルをダウンロードしました。", "mark": null}, {"i": 65, "line": 148, "section": 11, "kind": "sentence", "text": "しかし、ここで重大なミスを犯しました。", "mark": null}, {"i": 66, "line": 150, "section": 11, "kind": "sentence", "text": "誤配置: `~/MyAI_Lab/.claude/` に全ファイルを配置してしまったのです。", "mark": null}, {"i": 67, "line": 152, "section": 11, "kind": "sentence", "text": "本来は `~/.claude/`（ユーザーホーム直下）に配置すべきでした。", "mark": null}, {"i": 68, "line": 170, "section": 11, "kind": "sentence", "text": "この誤配置により、全プロジェクトが同じ設定を強制的に共有することになり、プロジェクトごとの柔軟な設定ができない状態でした。", "mark": null}, {"i": 69, "line": 174, "section": 12, "kind": "sentence", "text": "2026年1月31日〜2月7日の10日間、私はこの誤った配置のまま開発を続けました。", "mark": null}, {"i": 70, "line": 176, "section": 12, "kind": "sentence", "text": "次第に「プロジェクトごとに異なる設定をしたいのにできない」という問題に気づき始めました。", "mark": null}, {"i": 71, "line": 180, "section": 13, "kind": "sentence", "text": "公式ドキュメントとGitHub issuesを読み直し、ECCの階層構造（ユーザー > ワークスペース > プロジェクト）の真の意味を理解しました。", "mark": null}, {"i": 72, "line": 182, "section": 13, "kind": "sentence", "text": "修正作業：", "mark": null}, {"i": 73, "line": 184, "section": 13, "kind": "item", "text": "決断: MyAI_Lab/.claudeからの移行を決意", "mark": null}, {"i": 74, "line": 185, "section": 13, "kind": "item", "text": "移動: `~/.claude/` にrules/skills/agentsを移動", "mark": null}, {"i": 75, "line": 186, "section": 13, "kind": "item", "text": "削除: MyAI_Lab/.claude/からrules/skills/agentsを削除", "mark": null}, {"i": 76, "line": 187, "section": 13, "kind": "item", "text": "整理: MyAI_Lab/.claude/には `settings.local.json` のみ残す", "mark": null}, {"i": 77, "line": 188, "section": 13, "kind": "item", "text": "クリーンアップ: 不要なGitHub関連ファイル（README、LICENSE等）を削除", "mark": null}, {"i": 78, "line": 192, "section": 14, "kind": "sentence", "text": "この10日間の配置ミスは、結果的に学習機会でした：", "mark": null}, {"i": 79, "line": 194, "section": 14, "kind": "item", "text": "RTFM (Read The Fing Manual): 公式ドキュメントを最初に読むべきだった", "mark": null}, {"i": 80, "line": 195, "section": 14, "kind": "item", "text": "階層構造の理解: ユーザー/ワークスペース/プロジェクトの役割分担", "mark": null}, {"i": 81, "line": 196, "section": 14, "kind": "item", "text": "実践から学ぶ: 10日間の開発を通じて問題に気づき、修正", "mark": null}, {"i": 82, "line": 198, "section": 14, "kind": "sentence", "text": "比較対象がないため、失敗を恐れずに試行錯誤できました。", "mark": null}, {"i": 83, "line": 198, "section": 14, "kind": "sentence", "text": "この経験がなければ、ECCの階層構造を理解できなかったでしょう。", "mark": null}, {"i": 84, "line": 204, "section": 16, "kind": "sentence", "text": "開発の全体フローを経験できるのは、従来は一部の限られたマネジメント層だけでした：", "mark": null}, {"i": 85, "line": 206, "section": 16, "kind": "item", "text": "新人は「実装」だけを担当", "mark": null}, {"i": 86, "line": 207, "section": 16, "kind": "item", "text": "中堅は「設計と実装」を担当", "mark": null}, {"i": 87, "line": 208, "section": 16, "kind": "item", "text": "シニアが「計画から検証まで」を担当", "mark": null}, {"i": 88, "line": 209, "section": 16, "kind": "item", "text": "マネージャーだけが「全体フロー」を経験", "mark": null}, {"i": 89, "line": 211, "section": 16, "kind": "sentence", "text": "開発者がこの全体フローを経験するには、数年〜10年のキャリアが必要でした。", "mark": null}, {"i": 90, "line": 215, "section": 17, "kind": "sentence", "text": "従来、開発の全体フローを経験するには数年のキャリアが必要でした。", "mark": null}, {"i": 91, "line": 215, "section": 17, "kind": "sentence", "text": "ECCはそのサイクルを、誰でも短期間で何度も回せるようにします。", "mark": null}, {"i": 92, "line": 221, "section": 19, "kind": "sentence", "text": "「gitって何ですか？", "mark": null}, {"i": 93, "line": 221, "section": 19, "kind": "sentence", "text": "」「コミットって何ですか？", "mark": null}, {"i": 94, "line": 222, "section": 19, "kind": "sentence", "text": "」「ADRって何ですか？", "mark": null}, {"i": 95, "line": 223, "section": 19, "kind": "sentence", "text": "」「TDDって何ですか？", "mark": null}, {"i": 96, "line": 224, "section": 19, "kind": "sentence", "text": "」「カバレッジって何ですか？", "mark": null}, {"i": 97, "line": 227, "section": 19, "kind": "sentence", "text": "これが、私のECC導入初日の質問リストです。", "mark": null}, {"i": 98, "line": 229, "section": 19, "kind": "sentence", "text": "未知の言葉を見つけるたびに、しつこく質問しました。", "mark": null}, {"i": 99, "line": 231, "section": 19, "kind": "sentence", "text": "Claude Codeが何か提案してくる度に、わからない言葉があれば即座に質問。", "mark": null}, {"i": 100, "line": 231, "section": 19, "kind": "sentence", "text": "回答を受けて、さらに質問。", "mark": null}, {"i": 101, "line": 231, "section": 19, "kind": "sentence", "text": "この繰り返しでした。", "mark": null}, {"i": 102, "line": 235, "section": 20, "kind": "sentence", "text": "Claude Codeの提案を鵜呑みにしたわけではありません。", "mark": null}, {"i": 103, "line": 235, "section": 20, "kind": "sentence", "text": "常に以下のような疑問を持ち続けました：", "mark": null}, {"i": 104, "line": 237, "section": 20, "kind": "item", "text": "なぜそうするのか？", "mark": null}, {"i": 105, "line": 238, "section": 20, "kind": "item", "text": "他の方法はないのか？", "mark": null}, {"i": 106, "line": 239, "section": 20, "kind": "item", "text": "この用語の意味は？", "mark": null}, {"i": 107, "line": 240, "section": 20, "kind": "item", "text": "この設計の背景は？", "mark": null}, {"i": 108, "line": 242, "section": 20, "kind": "sentence", "text": "こうして、納得するまで質問し続けました。", "mark": null}, {"i": 109, "line": 246, "section": 21, "kind": "sentence", "text": "Claude Codeだけでは足りないとき、私は複数のLLMを使い分けました。", "mark": null}, {"i": 110, "line": 250, "section": 22, "kind": "sentence", "text": "まず、開発中に出てきた用語や概念をClaude Codeに質問します。", "mark": null}, {"i": 111, "line": 257, "section": 22, "kind": "sentence", "text": "しかし、Claude Codeの回答はそっけないときもあります。", "mark": null}, {"i": 112, "line": 257, "section": 22, "kind": "sentence", "text": "開発に特化したエージェントなので、教育的な説明が不十分なこともありました。", "mark": null}, {"i": 113, "line": 261, "section": 23, "kind": "sentence", "text": "Claude Codeの回答が不十分だと感じたとき、GeminiやClaude（通常版）に同じ質問をします。", "mark": null}, {"i": 114, "line": 268, "section": 23, "kind": "sentence", "text": "より詳しい説明、丁寧な例示、初心者向けの解説が得られます。", "mark": null}, {"i": 115, "line": 272, "section": 24, "kind": "sentence", "text": "それでもわからないとき、工夫しました。", "mark": null}, {"i": 116, "line": 280, "section": 24, "kind": "sentence", "text": "漫画やアニメの例えで説明してもらうことで、理解が深まりました。", "mark": null}, {"i": 117, "line": 284, "section": 25, "kind": "sentence", "text": "徹底的に調査したいとき、複数のLLMに同じ質問を並行投下します。", "mark": null}, {"i": 118, "line": 286, "section": 25, "kind": "item", "text": "Claude Code: 実践的な使い方", "mark": null}, {"i": 119, "line": 287, "section": 25, "kind": "item", "text": "Gemini: 概念の詳細説明", "mark": null}, {"i": 120, "line": 288, "section": 25, "kind": "item", "text": "ChatGPT: ベストプラクティス", "mark": null}, {"i": 121, "line": 289, "section": 25, "kind": "item", "text": "NotebookLM: 関連記事・ドキュメントの統合", "mark": null}, {"i": 122, "line": 291, "section": 25, "kind": "sentence", "text": "この4段階アプローチで、難しい概念も理解できるようになりました。", "mark": null}, {"i": 123, "line": 297, "section": 27, "kind": "sentence", "text": "最初は「コミット」の意味すらわかりませんでした。", "mark": null}, {"i": 124, "line": 299, "section": 27, "kind": "sentence", "text": "しかし、Claude Codeと一緒に初めて `git commit` を実行したとき：", "mark": null}, {"i": 125, "line": 306, "section": 27, "kind": "sentence", "text": "「ああ、これが『変更を記録する』ということか」と理解しました。", "mark": null}, {"i": 126, "line": 308, "section": 27, "kind": "sentence", "text": "バージョン管理という概念を初めて体験しました。", "mark": null}, {"i": 127, "line": 312, "section": 28, "kind": "sentence", "text": "あるプロジェクトで、重要なアルゴリズムを選択する決断をしました。", "mark": null}, {"i": 128, "line": 314, "section": 28, "kind": "sentence", "text": "Claude Codeが「ADRを書きましょう」と提案してきました。", "mark": null}, {"i": 129, "line": 323, "section": 28, "kind": "sentence", "text": "この説明で、私は「ドキュメント駆動開発」の価値を理解しました。", "mark": null}, {"i": 130, "line": 325, "section": 28, "kind": "sentence", "text": "そして、ADRを書きました：", "mark": null}, {"i": 131, "line": 338, "section": 28, "kind": "sentence", "text": "このADRは、後続のプロジェクトでも参照され、知識の再利用につながりました。", "mark": null}, {"i": 132, "line": 342, "section": 29, "kind": "sentence", "text": "あるプロジェクトで、テストを先に書く手法へ初めて挑戦しました。", "mark": null}, {"i": 133, "line": 355, "section": 29, "kind": "sentence", "text": "テストを実行して、`PASSED` が表示されました。", "mark": null}, {"i": 134, "line": 357, "section": 29, "kind": "sentence", "text": "「なるほど、これがTDDか」と納得しました。", "mark": null}, {"i": 135, "line": 359, "section": 29, "kind": "sentence", "text": "リファクタリングしても、テストが通れば安心。", "mark": null}, {"i": 136, "line": 359, "section": 29, "kind": "sentence", "text": "この安心感がTDDの価値だと理解しました。", "mark": null}, {"i": 137, "line": 363, "section": 30, "kind": "sentence", "text": "この「しつこく質問する」学習プロセスを10日間繰り返した結果、例えば：", "mark": null}, {"i": 138, "line": 365, "section": 30, "kind": "item", "text": "gitワークフロー: コミット、ブランチ、マージ", "mark": null}, {"i": 139, "line": 366, "section": 30, "kind": "item", "text": "TDD: テスト駆動開発", "mark": null}, {"i": 140, "line": 367, "section": 30, "kind": "item", "text": "ADR: アーキテクチャ決定記録", "mark": null}, {"i": 141, "line": 368, "section": 30, "kind": "item", "text": "ライセンス: AGPL-3.0等の違いと選択基準", "mark": null}, {"i": 142, "line": 369, "section": 30, "kind": "item", "text": "E2Eテスト: Playwrightでの検証", "mark": null}, {"i": 143, "line": 370, "section": 30, "kind": "item", "text": "型チェック: 型安全性", "mark": null}, {"i": 144, "line": 372, "section": 30, "kind": "sentence", "text": "これらは序の口に過ぎません。", "mark": null}, {"i": 145, "line": 372, "section": 30, "kind": "sentence", "text": "実際には、ほぼ全ての開発用語を10日前には知りませんでした。", "mark": null}, {"i": 146, "line": 374, "section": 30, "kind": "sentence", "text": "「しつこく質問する」ことで、多くを学びました。", "mark": null}, {"i": 147, "line": 378, "section": 31, "kind": "sentence", "text": "10日間で複数のプロジェクトに取り組む中で、PDCAサイクルが加速していくのを実感しました。", "mark": null}, {"i": 148, "line": 382, "section": 32, "kind": "sentence", "text": "最初のプロジェクトで、Plan→Do→Check→Actという一気通貫のフローを初めて体験しました：", "mark": null}, {"i": 149, "line": 384, "section": 32, "kind": "item", "text": "Plan: 技術調査、アーキテクチャ設計、実装計画", "mark": null}, {"i": 150, "line": 385, "section": 32, "kind": "item", "text": "Do: TDDでテストを先に書き、Vibe Codingで高速実装", "mark": null}, {"i": 151, "line": 386, "section": 32, "kind": "item", "text": "Check: コードレビュー、テスト実行、品質チェック", "mark": null}, {"i": 152, "line": 387, "section": 32, "kind": "item", "text": "Act: ADRで意思決定を記録、ドキュメント整備", "mark": null}, {"i": 153, "line": 391, "section": 33, "kind": "sentence", "text": "前回の学びを活かし、次のプロジェクトではサイクルが速く回りました：", "mark": null}, {"i": 154, "line": 393, "section": 33, "kind": "item", "text": "前回の知見を再利用（アーキテクチャパターン、テスト戦略）", "mark": null}, {"i": 155, "line": 394, "section": 33, "kind": "item", "text": "E2Eテストを含む包括的なテスト戦略", "mark": null}, {"i": 156, "line": 395, "section": 33, "kind": "item", "text": "セキュリティレビューの習慣化", "mark": null}, {"i": 157, "line": 399, "section": 34, "kind": "sentence", "text": "3つ目のプロジェクトで、より洗練されたサイクルを実現できました：", "mark": null}, {"i": 158, "line": 401, "section": 34, "kind": "item", "text": "堅実な計画主義: 実装前に詳細仕様をドキュメント化", "mark": null}, {"i": 159, "line": 402, "section": 34, "kind": "item", "text": "不変性の原則: `frozen=True` で予期しない変更を防ぐ", "mark": null}, {"i": 160, "line": 403, "section": 34, "kind": "item", "text": "包括的なドキュメント: ADR、CONTRIBUTING.md、RUNBOOK.md、README完備", "mark": null}, {"i": 161, "line": 407, "section": 35, "kind": "sentence", "text": "プロジェクトを通じて見えてきた本質：", "mark": null}, {"i": 162, "line": 409, "section": 35, "kind": "item", "text": "計画の重要性 - 「いきなりコードを書かない」が当たり前に", "mark": null}, {"i": 163, "line": 410, "section": 35, "kind": "item", "text": "TDDの価値 - テストを先に書き、安心してリファクタリング", "mark": null}, {"i": 164, "line": 411, "section": 35, "kind": "item", "text": "レビューの徹底 - agentを活用した品質・セキュリティチェック", "mark": null}, {"i": 165, "line": 412, "section": 35, "kind": "item", "text": "ドキュメント駆動 - 学びを蓄積し、次のサイクルへ", "mark": null}, {"i": 166, "line": 414, "section": 35, "kind": "sentence", "text": "ECC環境が「当然のこと」として提案してくれ、私はしつこく質問しながら、その価値を理解していきました。", "mark": null}, {"i": 167, "line": 418, "section": 36, "kind": "sentence", "text": "このSpotifyポッドキャストがなければ、私はECCと出会うことはありませんでした：", "mark": null}, {"i": 168, "line": 422, "section": 36, "kind": "sentence", "text": "いけともさんのYoutube動画で具体的な使い方を学びました：", "mark": null}, {"i": 169, "line": 426, "section": 36, "kind": "sentence", "text": "Before: gitも知らない趣味プログラマー。", "mark": null}, {"i": 170, "line": 427, "section": 36, "kind": "sentence", "text": "After: 開発の完全なPDCAサイクルを体得。", "mark": null}, {"i": 171, "line": 429, "section": 36, "kind": "sentence", "text": "この10日間の変化は、お二人の情報発信がなければ起こりませんでした。", "mark": null}, {"i": 172, "line": 431, "section": 36, "kind": "sentence", "text": "この記事では、失敗談（配置ミスで10日間）も正直に書きました。", "mark": null}, {"i": 173, "line": 431, "section": 36, "kind": "sentence", "text": "次の誰かが同じ失敗をしないために。", "mark": null}, {"i": 174, "line": 435, "section": 37, "kind": "sentence", "text": "gitも知らなかった初心者が、10日間でこうしてZennに技術記事を書いています。", "mark": null}, {"i": 175, "line": 437, "section": 37, "kind": "sentence", "text": "学んだのは個別のスキルではなく、開発の全体フローでした。", "mark": null}, {"i": 176, "line": 437, "section": 37, "kind": "sentence", "text": "ECC環境と「しつこく質問する」姿勢の組み合わせが、この短期間での変化を可能にしました。", "mark": null}, {"i": 177, "line": 443, "section": 38, "kind": "sentence", "text": "後編では、この10日間で到達した「エコシステム設計者」への道を明かします。", "mark": null}, {"i": 178, "line": 445, "section": 38, "kind": "item", "text": "メタ認知の発動（「開発記録をコンテンツ化できる」という気づき）", "mark": null}, {"i": 179, "line": 446, "section": 38, "kind": "item", "text": "マルチLLMディープリサーチの高度な活用", "mark": null}, {"i": 180, "line": 447, "section": 38, "kind": "item", "text": "ECC Architectエージェント活用（システム設計からSkill化まで）", "mark": null}, {"i": 181, "line": 448, "section": 38, "kind": "item", "text": "エコシステムの全体像（入力→処理→出力→フィードバック）", "mark": null}, {"i": 182, "line": 450, "section": 38, "kind": "sentence", "text": "お楽しみに！", "mark": null}, {"i": 183, "line": 454, "section": 39, "kind": "item", "text": "この記事のMarkdown正本（GitHub） — 全記事のMarkdownと索引（docs/PUBLICATIONS.md）は同じリポジトリにあります", "mark": null}, {"i": 184, "line": 455, "section": 39, "kind": "item", "text": "著者のGitHub — DOI 付きの研究リポジトリ一覧", "mark": null}, {"i": 185, "line": 459, "section": 39, "kind": "sentence", "text": "この記事が役に立ったら、いいねをお願いします。", "mark": null}]}, {"text_id": "ecc-journey-part2", "sha256": "888e7b36a524f977188fff830c26592ce783c788d7504bc6bad4c7aa4e914e55", "units": [{"i": 0, "line": 12, "section": 1, "kind": "sentence", "text": "前回の記事で、Everything Claude Code (ECC) 環境で初めて本格的な開発を始めた 10 日間のことを書きました。", "mark": null}, {"i": 1, "line": 12, "section": 1, "kind": "sentence", "text": "git も知らなかった初心者が、PDCAサイクルを何度も回しながら開発を覚えていく話でした。", "mark": null}, {"i": 2, "line": 14, "section": 1, "kind": "sentence", "text": "今回は、その 10 日間の後半で作った pdf2anki というツールの話をします。", "mark": null}, {"i": 3, "line": 18, "section": 2, "kind": "sentence", "text": "G検定の勉強のために、忘却曲線に基づく出題アプリを作りました。", "mark": null}, {"i": 4, "line": 18, "section": 2, "kind": "sentence", "text": "Python/Streamlit で Web 版、Swift/SwiftUI で iOS 版。", "mark": null}, {"i": 5, "line": 18, "section": 2, "kind": "sentence", "text": "ECC 環境の TDD で実装し、ADR で意思決定を記録しながら、2 週間で動くものができました。", "mark": null}, {"i": 6, "line": 20, "section": 2, "kind": "sentence", "text": "できてから気づきました。", "mark": null}, {"i": 7, "line": 20, "section": 2, "kind": "sentence", "text": "自分が作っていたのは Anki の再発明だったのです。", "mark": null}, {"i": 8, "line": 22, "section": 2, "kind": "sentence", "text": "20 年以上の歴史を持つ Anki と同じものを 2 週間で作り直す意味はありません。", "mark": null}, {"i": 9, "line": 22, "section": 2, "kind": "sentence", "text": "しかし開発の過程で、本当のボトルネックが見えました。", "mark": null}, {"i": 10, "line": 22, "section": 2, "kind": "sentence", "text": "アプリではなくコンテンツです。", "mark": null}, {"i": 11, "line": 24, "section": 2, "kind": "sentence", "text": "iOS 版では PDF からテキスト化したデータを正規表現と LLM で 410 問の問答ペアに抽出するアルゴリズムを実装しました。", "mark": null}, {"i": 12, "line": 24, "section": 2, "kind": "sentence", "text": "しかし、表記揺れや章構造の不一致で精度が安定しませんでした。", "mark": null}, {"i": 13, "line": 24, "section": 2, "kind": "sentence", "text": "「第 1 章」と「第1章」（スペースの有無）でマッチングが壊れるような世界です。", "mark": null}, {"i": 14, "line": 26, "section": 2, "kind": "sentence", "text": "「どんなテキストからでも高品質な Anki カードを自動生成する」ツールがあれば、アプリ本体は Anki に任せられます。", "mark": null}, {"i": 15, "line": 28, "section": 2, "kind": "sentence", "text": "そうして作り始めたのが pdf2anki です。", "mark": null}, {"i": 16, "line": 34, "section": 2, "kind": "sentence", "text": "PDF、テキスト、Markdown を入力すると、Claude API でフラッシュカード（TSV/JSON）を出力する CLI ツールです。", "mark": null}, {"i": 17, "line": 36, "section": 2, "kind": "sentence", "text": "この記事では、pdf2anki を作る過程で踏んだ 6 つの落とし穴 と、その防御策を書きます。", "mark": null}, {"i": 18, "line": 36, "section": 2, "kind": "sentence", "text": "Claude API をこれから使う人が同じ穴を避けられるように。", "mark": null}, {"i": 19, "line": 38, "section": 2, "kind": "sentence", "text": "前回の記事で書いた「しつこく質問する」姿勢は、今回も変わりません。", "mark": null}, {"i": 20, "line": 38, "section": 2, "kind": "sentence", "text": "Claude Code に「なぜこうするのか？", "mark": null}, {"i": 21, "line": 38, "section": 2, "kind": "sentence", "text": "」「他の方法はないのか？", "mark": null}, {"i": 22, "line": 38, "section": 2, "kind": "sentence", "text": "」と聞き続けました。", "mark": null}, {"i": 23, "line": 38, "section": 2, "kind": "sentence", "text": "その質問と回答の中から見えてきた設計判断を、できるだけ正直に書きます。", "mark": null}, {"i": 24, "line": 46, "section": 4, "kind": "sentence", "text": "Claude API にカード生成を依頼すると、返ってくる JSON がそのままパースできないことがあります。", "mark": null}, {"i": 25, "line": 48, "section": 4, "kind": "sentence", "text": "プロンプトに「JSON だけを返せ」と書いても、マークダウンの ` ```json ``` ` で囲んでくることがあります。", "mark": null}, {"i": 26, "line": 48, "section": 4, "kind": "sentence", "text": "配列の途中に説明テキストが混じることもあります。", "mark": null}, {"i": 27, "line": 48, "section": 4, "kind": "sentence", "text": "カンマが余分だったり、閉じ括弧が足りなかったりします。", "mark": null}, {"i": 28, "line": 50, "section": 4, "kind": "sentence", "text": "LLM の出力は確率的です。", "mark": null}, {"i": 29, "line": 50, "section": 4, "kind": "sentence", "text": "「こう返せ」と指示しても、100% の保証はありません。", "mark": null}, {"i": 30, "line": 54, "section": 5, "kind": "sentence", "text": "最初は `json.loads()` で一括パースし、失敗したら全体をリトライしていました。", "mark": null}, {"i": 31, "line": 54, "section": 5, "kind": "sentence", "text": "10 枚のカードのうち 1 枚だけフォーマットが壊れていても、10 枚全部を再生成します。", "mark": null}, {"i": 32, "line": 54, "section": 5, "kind": "sentence", "text": "API コストが無駄に膨らみました。", "mark": null}, {"i": 33, "line": 67, "section": 6, "kind": "sentence", "text": "10 枚中 1 枚が壊れていても、残り 9 枚は救います。", "mark": null}, {"i": 34, "line": 69, "section": 6, "kind": "sentence", "text": "「成功か失敗の二択」ではなく「部分的な成功を許容する」設計。", "mark": null}, {"i": 35, "line": 69, "section": 6, "kind": "sentence", "text": "これは LLM を組み込むツール全般に通用する原則です。", "mark": null}, {"i": 36, "line": 71, "section": 6, "kind": "sentence", "text": "JSON のラッピング（` ```json ``` `）は正規表現で事前に剥がしてからパースに回します。", "mark": null}, {"i": 37, "line": 71, "section": 6, "kind": "sentence", "text": "泥臭い前処理ですが、こういう小さな防御の積み重ねが LLM 連携の安定性を支えています。", "mark": null}, {"i": 38, "line": 75, "section": 6, "kind": "sentence", "text": "持ち帰り: LLM の出力パースは「壊れる前提」で書く。", "mark": null}, {"i": 39, "line": 75, "section": 6, "kind": "sentence", "text": "全体リトライではなく、個別スキップ＋ログで回復力を持たせる。", "mark": null}, {"i": 40, "line": 85, "section": 8, "kind": "sentence", "text": "JSON が正しくパースできても、中身の品質は保証されません。", "mark": null}, {"i": 41, "line": 87, "section": 8, "kind": "sentence", "text": "実際に出てきた問題カードの例です：", "mark": null}, {"i": 42, "line": 89, "section": 8, "kind": "item", "text": "表面が「説明してください」だけ。何を説明するのかわからない", "mark": null}, {"i": 43, "line": 90, "section": 8, "kind": "item", "text": "裏面が 500 文字超。カードではなくレポート", "mark": null}, {"i": 44, "line": 91, "section": 8, "kind": "item", "text": "1 枚に 3 つの概念が詰め込まれている。Anki のカードは 1 枚 1 概念が原則", "mark": null}, {"i": 45, "line": 92, "section": 8, "kind": "item", "text": "リスト問題なのに QA 形式で出力されている。穴埋めにすべき", "mark": null}, {"i": 46, "line": 94, "section": 8, "kind": "sentence", "text": "「LLM に任せたから大丈夫」は危険な前提でした。", "mark": null}, {"i": 47, "line": 98, "section": 9, "kind": "sentence", "text": "全カードを LLM に再評価させる方式を最初に試しました。", "mark": null}, {"i": 48, "line": 98, "section": 9, "kind": "sentence", "text": "生成と評価の両方で API を叩くので、コストが単純に倍になります。", "mark": null}, {"i": 49, "line": 98, "section": 9, "kind": "sentence", "text": "100 枚のカードを作るたびに 200 回の API コール。", "mark": null}, {"i": 50, "line": 98, "section": 9, "kind": "sentence", "text": "現実的ではありません。", "mark": null}, {"i": 51, "line": 102, "section": 10, "kind": "sentence", "text": "第 1 層（コード判定・LLM 不要）: ヒューリスティックスコアリング", "mark": null}, {"i": 52, "line": 104, "section": 10, "kind": "sentence", "text": "6 つの軸で 0〜1 のスコアを付け、重み付き合計が 0.90 以上なら合格。", "mark": null}, {"i": 53, "line": 104, "section": 10, "kind": "sentence", "text": "LLM は呼びません。", "mark": null}, {"i": 54, "line": 115, "section": 10, "kind": "sentence", "text": "原子性の判定が面白かったです。", "mark": null}, {"i": 55, "line": 115, "section": 10, "kind": "sentence", "text": "裏面を句点で分割し、文数が多ければ「複数概念が混在している」と判定します。", "mark": null}, {"i": 56, "line": 128, "section": 10, "kind": "sentence", "text": "「また、」「さらに」が出てきたら、1 枚のカードに情報を詰め込みすぎている可能性が高いです。", "mark": null}, {"i": 57, "line": 128, "section": 10, "kind": "sentence", "text": "人間が見ても分割すべきと判断できるカードを、コードで検出できます。", "mark": null}, {"i": 58, "line": 130, "section": 10, "kind": "sentence", "text": "第 2 層（LLM 使用）: 0.90 未満のカードだけを Claude に批評させる", "mark": null}, {"i": 59, "line": 132, "section": 10, "kind": "sentence", "text": "批評結果は 3 択: `improve`（書き直し）、`split`（分割）、`remove`（削除）。", "mark": null}, {"i": 60, "line": 132, "section": 10, "kind": "sentence", "text": "最大 2 ラウンドです。", "mark": null}, {"i": 61, "line": 134, "section": 10, "kind": "sentence", "text": "ポイントは 全カードに LLM を使わない こと。", "mark": null}, {"i": 62, "line": 134, "section": 10, "kind": "sentence", "text": "スコア 0.90 以上のカードは第 1 層で素通りさせます。", "mark": null}, {"i": 63, "line": 134, "section": 10, "kind": "sentence", "text": "実測では生成カードの 60〜70% が第 1 層を通過しました。", "mark": null}, {"i": 64, "line": 134, "section": 10, "kind": "sentence", "text": "LLM 批評が必要なのは 30〜40% です。", "mark": null}, {"i": 65, "line": 136, "section": 10, "kind": "sentence", "text": "第 3 層（コード判定・LLM 不要）: 重複検出", "mark": null}, {"i": 66, "line": 138, "section": 10, "kind": "sentence", "text": "文字バイグラムの Jaccard 類似度で重複を検出します。", "mark": null}, {"i": 67, "line": 138, "section": 10, "kind": "sentence", "text": "表面の類似度が 0.7 を超えたら重複フラグを立てます。", "mark": null}, {"i": 68, "line": 140, "section": 10, "kind": "sentence", "text": "前回の記事で書いた ECC の TDD と同じ発想です。", "mark": null}, {"i": 69, "line": 140, "section": 10, "kind": "sentence", "text": "テストを先に書くように、品質の基準を先に定義する。", "mark": null}, {"i": 70, "line": 140, "section": 10, "kind": "sentence", "text": "基準がなければ「良くなった気がする」で終わります。", "mark": null}, {"i": 71, "line": 144, "section": 10, "kind": "sentence", "text": "持ち帰り: 「LLM で判定できること」と「コードで判定できること」を分ける。", "mark": null}, {"i": 72, "line": 144, "section": 10, "kind": "sentence", "text": "コードで済む判定に LLM を使うのは、精度ではなくコストの問題。", "mark": null}, {"i": 73, "line": 154, "section": 12, "kind": "sentence", "text": "Claude API は従量制です。", "mark": null}, {"i": 74, "line": 154, "section": 12, "kind": "sentence", "text": "Sonnet で入力 $3/M tokens、出力 $15/M tokens。", "mark": null}, {"i": 75, "line": 156, "section": 12, "kind": "sentence", "text": "100 ページの PDF を処理したらいくらかかるか。", "mark": null}, {"i": 76, "line": 156, "section": 12, "kind": "sentence", "text": "実行してみるまでわかりません。", "mark": null}, {"i": 77, "line": 158, "section": 12, "kind": "sentence", "text": "初期テスト中、うっかり長い PDF を処理して $2 近く使ったことがあります。", "mark": null}, {"i": 78, "line": 158, "section": 12, "kind": "sentence", "text": "学習用の個人ツールでこの出費は痛いです。", "mark": null}, {"i": 79, "line": 162, "section": 13, "kind": "sentence", "text": "① 実行前のコスト見積もり", "mark": null}, {"i": 80, "line": 164, "section": 13, "kind": "sentence", "text": "`preview` コマンドで、API を叩かずに見積もりを出します。", "mark": null}, {"i": 81, "line": 172, "section": 13, "kind": "sentence", "text": "ユーザーが「これなら OK」と判断してから `convert` を実行する流れにしました。", "mark": null}, {"i": 82, "line": 174, "section": 13, "kind": "sentence", "text": "② budget_limit で暴走防止", "mark": null}, {"i": 83, "line": 176, "section": 13, "kind": "sentence", "text": "`CostTracker` に予算上限（デフォルト $1.00）を設定し、API コールのたびに累積コストをチェックします。", "mark": null}, {"i": 84, "line": 176, "section": 13, "kind": "sentence", "text": "超えたらそこで止まります。", "mark": null}, {"i": 85, "line": 185, "section": 13, "kind": "sentence", "text": "`frozen=True` で不変にしています。", "mark": null}, {"i": 86, "line": 185, "section": 13, "kind": "sentence", "text": "前回の記事で触れた「不変性の原則」がここで効きました。", "mark": null}, {"i": 87, "line": 185, "section": 13, "kind": "sentence", "text": "API コールのたびに新しい `CostTracker` インスタンスを返します。", "mark": null}, {"i": 88, "line": 185, "section": 13, "kind": "sentence", "text": "途中で値が書き換わることはありません。", "mark": null}, {"i": 89, "line": 185, "section": 13, "kind": "sentence", "text": "「いまいくら使ったか」を常に正確に追跡できます。", "mark": null}, {"i": 90, "line": 187, "section": 13, "kind": "sentence", "text": "③ テキスト量に応じたモデル自動選択", "mark": null}, {"i": 91, "line": 189, "section": 13, "kind": "sentence", "text": "短いテキスト（10,000 文字未満、30 枚未満）ならコストが約 1/4 の Haiku を使い、多ければ Sonnet にルーティングします。", "mark": null}, {"i": 92, "line": 196, "section": 13, "kind": "sentence", "text": "単純な閾値分岐ですが、短いテキストの処理コストが大幅に下がります。", "mark": null}, {"i": 93, "line": 200, "section": 13, "kind": "sentence", "text": "持ち帰り: 従量制 API を使うツールには「実行前の見積もり」「実行中の上限」「モデルの使い分け」の 3 点セットを入れる。", "mark": null}, {"i": 94, "line": 200, "section": 13, "kind": "sentence", "text": "ユーザーの財布を守るのは開発者の責任。", "mark": null}, {"i": 95, "line": 210, "section": 15, "kind": "sentence", "text": "Claude の入力トークン上限は約 200K ですが、一度に大量のテキストを投げるとカードの品質が落ちます。", "mark": null}, {"i": 96, "line": 210, "section": 15, "kind": "sentence", "text": "分割が必要です。", "mark": null}, {"i": 97, "line": 214, "section": 16, "kind": "sentence", "text": "最初はテキストを文字数で均等に切っていました。", "mark": null}, {"i": 98, "line": 214, "section": 16, "kind": "sentence", "text": "当然、章の途中で切れます。", "mark": null}, {"i": 99, "line": 216, "section": 16, "kind": "sentence", "text": "「第 3 章の後半」と「第 4 章の前半」が混ざったチャンクから生成されたカードは、文脈がおかしくなりました。", "mark": null}, {"i": 100, "line": 216, "section": 16, "kind": "sentence", "text": "ある章の用語定義が別の章の概念と混同されます。", "mark": null}, {"i": 101, "line": 220, "section": 17, "kind": "sentence", "text": "Markdown の見出し（`#`、`##`、`###`）で論理的に分割する方式に変えました。", "mark": null}, {"i": 102, "line": 222, "section": 17, "kind": "sentence", "text": "各セクションに breadcrumb（パンくずリスト） を付与します。", "mark": null}, {"i": 103, "line": 222, "section": 17, "kind": "sentence", "text": "Web サイトの「ホーム > 製品 > iPhone」のような、いま全体のどの階層にいるかを示すナビゲーションです。", "mark": null}, {"i": 104, "line": 228, "section": 17, "kind": "sentence", "text": "Claude はこの breadcrumb を見て「いま第 1 章の語源の話をしている」と理解できます。", "mark": null}, {"i": 105, "line": 228, "section": 17, "kind": "sentence", "text": "チャンクの先頭にこのコンテキストがあるだけで、生成されるカードの文脈が格段に正確になりました。", "mark": null}, {"i": 106, "line": 230, "section": 17, "kind": "sentence", "text": "見出し階層は `heading_stack` という辞書で追跡します。", "mark": null}, {"i": 107, "line": 230, "section": 17, "kind": "sentence", "text": "H2 が出現したら、それ以下の H3 情報をクリアします。", "mark": null}, {"i": 108, "line": 238, "section": 17, "kind": "sentence", "text": "1 セクションが 30,000 文字を超えたら段落単位でサブ分割し、見出しに `(cont.)` を付けて連続セクションだと示します。", "mark": null}, {"i": 109, "line": 242, "section": 18, "kind": "sentence", "text": "2 つあります。", "mark": null}, {"i": 110, "line": 244, "section": 18, "kind": "sentence", "text": "1 つ目。", "mark": null}, {"i": 111, "line": 244, "section": 18, "kind": "sentence", "text": "Markdown 見出しがないテキストへの対応です。", "mark": null}, {"i": 112, "line": 244, "section": 18, "kind": "sentence", "text": "日本語の書籍なら「第1章」「（1）」「一、」といったパターンで見出しを検出するフォールバックを入れました。", "mark": null}, {"i": 113, "line": 246, "section": 18, "kind": "sentence", "text": "2 つ目。", "mark": null}, {"i": 114, "line": 246, "section": 18, "kind": "sentence", "text": "トークン推定の誤差です。", "mark": null}, {"i": 115, "line": 246, "section": 18, "kind": "sentence", "text": "`CHARS_PER_TOKEN = 4` という定数は英語基準です。", "mark": null}, {"i": 116, "line": 246, "section": 18, "kind": "sentence", "text": "日本語は 1 トークンあたり 2〜3 文字なので、コスト推定が実際の半分程度になります。", "mark": null}, {"i": 117, "line": 246, "section": 18, "kind": "sentence", "text": "これは既知の未修正問題です。", "mark": null}, {"i": 118, "line": 246, "section": 18, "kind": "sentence", "text": "日本語を扱うなら係数を 2.5 程度に修正する必要があります。", "mark": null}, {"i": 119, "line": 250, "section": 18, "kind": "sentence", "text": "持ち帰り: 長文を LLM に渡すときは「意味の境界」で切る。", "mark": null}, {"i": 120, "line": 250, "section": 18, "kind": "sentence", "text": "機械的な文字数分割は文脈を壊す。", "mark": null}, {"i": 121, "line": 250, "section": 18, "kind": "sentence", "text": "分割後のチャンクに「いまどこの話か」のメタ情報を付与すると、出力品質が大きく改善する。", "mark": null}, {"i": 122, "line": 260, "section": 20, "kind": "sentence", "text": "PDF にはテキストだけでなく図やチャートもあります。", "mark": null}, {"i": 123, "line": 262, "section": 20, "kind": "sentence", "text": "Claude API にはテキストだけでなく 画像も入力できる機能（Vision） があります。", "mark": null}, {"i": 124, "line": 262, "section": 20, "kind": "sentence", "text": "写真や図を送ると、Claude が「この画像に何が写っているか」を理解して回答してくれます。", "mark": null}, {"i": 125, "line": 262, "section": 20, "kind": "sentence", "text": "これを使えば、教科書の図表からもカードを生成できます。", "mark": null}, {"i": 126, "line": 264, "section": 20, "kind": "sentence", "text": "「全ページを画像として Vision に投げれば完璧では？", "mark": null}, {"i": 127, "line": 264, "section": 20, "kind": "sentence", "text": "」と思いました。", "mark": null}, {"i": 128, "line": 266, "section": 20, "kind": "sentence", "text": "コストを計算して目が覚めました。", "mark": null}, {"i": 129, "line": 268, "section": 20, "kind": "sentence", "text": "画像のトークンコストは `(幅 × 高さ) ÷ 750` です。", "mark": null}, {"i": 130, "line": 268, "section": 20, "kind": "sentence", "text": "100 ページを全ページ画像化すると画像だけで約 15 万トークン。", "mark": null}, {"i": 131, "line": 268, "section": 20, "kind": "sentence", "text": "テキストと合わせて 30 万トークン、約 $1。", "mark": null}, {"i": 132, "line": 268, "section": 20, "kind": "sentence", "text": "テキストだけなら $0.15 程度です。", "mark": null}, {"i": 133, "line": 268, "section": 20, "kind": "sentence", "text": "7 倍のコスト差です。", "mark": null}, {"i": 134, "line": 272, "section": 21, "kind": "sentence", "text": "① 画像カバレッジ閾値: 20%", "mark": null}, {"i": 135, "line": 274, "section": 21, "kind": "sentence", "text": "pymupdf でページ内の画像面積を計算し、ページ面積の 20% 以上を画像が占めるページだけ Vision に回します。", "mark": null}, {"i": 136, "line": 274, "section": 21, "kind": "sentence", "text": "テキスト主体のページはテキスト抽出で十分です。", "mark": null}, {"i": 137, "line": 276, "section": 21, "kind": "sentence", "text": "② DPI: 150 に固定", "mark": null}, {"i": 138, "line": 278, "section": 21, "kind": "sentence", "text": "Vision の制約は長辺 1568px、最大 1.15 メガピクセルです。", "mark": null}, {"i": 139, "line": 280, "section": 21, "kind": "item", "text": "300 DPI: きれいだがトークンが倍。1 画像 3,000 トークン超", "mark": null}, {"i": 140, "line": 281, "section": 21, "kind": "item", "text": "72 DPI: 安いが図中の文字が潰れる", "mark": null}, {"i": 141, "line": 282, "section": 21, "kind": "item", "text": "150 DPI: 文字が読める最低限の解像度。1 画像 1,500 トークン程度", "mark": null}, {"i": 142, "line": 284, "section": 21, "kind": "sentence", "text": "③ 1 ページ最大 5 画像", "mark": null}, {"i": 143, "line": 286, "section": 21, "kind": "sentence", "text": "5 枚 × 1,500 トークン = 7,500 トークン。", "mark": null}, {"i": 144, "line": 286, "section": 21, "kind": "sentence", "text": "budget_limit と組み合わせれば暴走しません。", "mark": null}, {"i": 145, "line": 288, "section": 21, "kind": "sentence", "text": "この 3 つの妥協で、Vision ありの処理コストをテキストのみの 1.5〜2 倍に抑えました。", "mark": null}, {"i": 146, "line": 288, "section": 21, "kind": "sentence", "text": "7 倍にはなりません。", "mark": null}, {"i": 147, "line": 292, "section": 21, "kind": "sentence", "text": "持ち帰り: Vision は強力だが高い。", "mark": null}, {"i": 148, "line": 292, "section": 21, "kind": "sentence", "text": "「全部画像で投げれば楽」という誘惑に負けず、テキスト抽出で済む部分はテキストで処理する。", "mark": null}, {"i": 149, "line": 292, "section": 21, "kind": "sentence", "text": "画像は本当に必要なページだけに絞る。", "mark": null}, {"i": 150, "line": 302, "section": 23, "kind": "sentence", "text": "プロンプトを書き換えたとき、カードの品質への影響を判定できません。", "mark": null}, {"i": 151, "line": 302, "section": 23, "kind": "sentence", "text": "「良くなった気がする」では心許ないです。", "mark": null}, {"i": 152, "line": 302, "section": 23, "kind": "sentence", "text": "LLM の出力は非決定的で、同じプロンプトでも毎回違う結果が出ます。", "mark": null}, {"i": 153, "line": 306, "section": 24, "kind": "sentence", "text": "LLM 開発では、出力品質の自動評価を Eval（エバル） と呼びます。", "mark": null}, {"i": 154, "line": 308, "section": 24, "kind": "sentence", "text": "pdf2anki では「このテキストからはこういうカードが生成されるべき」という期待値を YAML で定義し、実際の出力と照合する方式を採りました。", "mark": null}, {"i": 155, "line": 325, "section": 24, "kind": "sentence", "text": "生成されたカードにキーワードが含まれているかで一致度を計算し、Recall（網羅率）・Precision（正確率）・F1（両者のバランス指標）を出力します。", "mark": null}, {"i": 156, "line": 332, "section": 24, "kind": "sentence", "text": "キーワードマッチには限界があります。", "mark": null}, {"i": 157, "line": 332, "section": 24, "kind": "sentence", "text": "「ニューラルネットワーク」と「神経回路網」を同一視できません。", "mark": null}, {"i": 158, "line": 334, "section": 24, "kind": "sentence", "text": "しかし重要なのは「プロンプト変更で回帰（＝前より悪くなること）が起きていないか」の検知です。", "mark": null}, {"i": 159, "line": 334, "section": 24, "kind": "sentence", "text": "完璧な意味理解ではありません。", "mark": null}, {"i": 160, "line": 334, "section": 24, "kind": "sentence", "text": "プロンプトを変えるたびに `pdf2anki eval` を回して F1 が下がっていないか確認する。", "mark": null}, {"i": 161, "line": 334, "section": 24, "kind": "sentence", "text": "これだけで改善が博打ではなくなります。", "mark": null}, {"i": 162, "line": 336, "section": 24, "kind": "sentence", "text": "ECC の TDD で学んだことと同じです。", "mark": null}, {"i": 163, "line": 336, "section": 24, "kind": "sentence", "text": "テストがあれば、リファクタリングしても安心できます。", "mark": null}, {"i": 164, "line": 336, "section": 24, "kind": "sentence", "text": "Eval があれば、プロンプトを書き換えても安心できます。", "mark": null}, {"i": 165, "line": 340, "section": 24, "kind": "sentence", "text": "持ち帰り: LLM の出力品質は「テストケース」で管理する。", "mark": null}, {"i": 166, "line": 340, "section": 24, "kind": "sentence", "text": "完璧な自動評価でなくていい。", "mark": null}, {"i": 167, "line": 340, "section": 24, "kind": "sentence", "text": "「回帰を検知できる」だけで、プロンプト改善の生産性が大きく変わる。", "mark": null}, {"i": 168, "line": 348, "section": 25, "kind": "sentence", "text": "pdf2anki を作る過程は、妥協の連続でした。", "mark": null}, {"i": 169, "line": 359, "section": 25, "kind": "sentence", "text": "どれも「理想の設計」ではなく「現実との折り合い」の産物です。", "mark": null}, {"i": 170, "line": 361, "section": 25, "kind": "sentence", "text": "開発全体を通して効いた判断基準が1つあります。", "mark": null}, {"i": 171, "line": 361, "section": 25, "kind": "sentence", "text": "「これをやらない場合、同じ時間で何ができるか」 を常に問うことです。", "mark": null}, {"i": 172, "line": 363, "section": 25, "kind": "sentence", "text": "途中で「OpenAI にも対応すべきでは」と考えました。", "mark": null}, {"i": 173, "line": 363, "section": 25, "kind": "sentence", "text": "$10 クレジットが残っていたからです。", "mark": null}, {"i": 174, "line": 363, "section": 25, "kind": "sentence", "text": "実装を見積もると 1,000 行、10 時間。", "mark": null}, {"i": 175, "line": 363, "section": 25, "kind": "sentence", "text": "$10 の回収に時給 $1 で働く計算です。", "mark": null}, {"i": 176, "line": 363, "section": 25, "kind": "sentence", "text": "同じ 10 時間で画像カード生成、TUI、Eval フレームワークが作れました。", "mark": null}, {"i": 177, "line": 365, "section": 25, "kind": "sentence", "text": "前回の記事で書いた ECC の PDCA サイクルが、ここでも回っています。", "mark": null}, {"i": 178, "line": 367, "section": 25, "kind": "item", "text": "Plan: Claude Code に「なぜこうするのか？」をしつこく質問し、設計の背景を理解する", "mark": null}, {"i": 179, "line": 368, "section": 25, "kind": "item", "text": "Do: TDD でテストを先に書き、実装する", "mark": null}, {"i": 180, "line": 369, "section": 25, "kind": "item", "text": "Check: Eval でプロンプトの品質を測定し、ヒューリスティックでカードの品質を検証する", "mark": null}, {"i": 181, "line": 370, "section": 25, "kind": "item", "text": "Act: ADR で「なぜ OpenAI 対応を捨てたか」「なぜ画像閾値を 20% にしたか」を記録する", "mark": null}, {"i": 182, "line": 372, "section": 25, "kind": "sentence", "text": "Claude API は強力なツールです。", "mark": null}, {"i": 183, "line": 372, "section": 25, "kind": "sentence", "text": "しかし「API を叩けば解決する」と思った瞬間に、コストが膨らみ、品質が不安定になり、デバッグが困難になります。", "mark": null}, {"i": 184, "line": 372, "section": 25, "kind": "sentence", "text": "API の力を引き出すのは、その周辺に積み上げる防御的な設計です。", "mark": null}, {"i": 185, "line": 374, "section": 25, "kind": "sentence", "text": "この記事が、同じ道を歩く人の参考になれば幸いです。", "mark": null}, {"i": 186, "line": 376, "section": 25, "kind": "sentence", "text": "pdf2anki は GitHub で公開 しています。", "mark": null}, {"i": 187, "line": 380, "section": 26, "kind": "item", "text": "この記事のMarkdown正本（GitHub） — 全記事のMarkdownと索引（docs/PUBLICATIONS.md）は同じリポジトリにあります", "mark": null}, {"i": 188, "line": 381, "section": 26, "kind": "item", "text": "著者のGitHub — DOI 付きの研究リポジトリ一覧", "mark": null}]}, {"text_id": "jev-skill-router.README.ja", "sha256": "4da0c5d7fc877ed9caf993e0dd122603ec55885a126fd5ace337061e09fe7920", "units": [{"i": 0, "line": 1, "section": 0, "kind": "sentence", "text": "English | 日本語", "mark": null}, {"i": 1, "line": 5, "section": 1, "kind": "sentence", "text": "Jev を skill の router として Claude Code に足すと、何が起きるか。", "mark": null}, {"i": 2, "line": 5, "section": 1, "kind": "sentence", "text": "そのコードとログと、外すことで終わった 1 週間の記録です。", "mark": null}, {"i": 3, "line": 15, "section": 1, "kind": "sentence", "text": "jev-skill-router は、TypeSafe の Jev で何かを作る人のための参照実装です。", "mark": null}, {"i": 4, "line": 15, "section": 1, "kind": "sentence", "text": "Jev は文章を書かず、型の決まった質問に確率で答えるモデルです。", "mark": null}, {"i": 5, "line": 15, "section": 1, "kind": "sentence", "text": "このリポジトリの本体は Claude Code の hook で、プロンプトのたびに、インストール済みのどの skill が合うかを Jev に尋ねてログに残します。", "mark": null}, {"i": 6, "line": 15, "section": 1, "kind": "sentence", "text": "既定の shadow モードではそこまでで、inject モードにすると Claude に 1 行のヒントも渡します。", "mark": null}, {"i": 7, "line": 15, "section": 1, "kind": "sentence", "text": "そのログを、Claude Code が実際に次に何をしたかと突き合わせるスクリプトも同梱しています。", "mark": null}, {"i": 8, "line": 15, "section": 1, "kind": "sentence", "text": "Python 3.10 以上、標準ライブラリのみ、MIT ライセンス、バージョン 0.2.0 で、有料の TypeSafe API key が必要です。", "mark": null}, {"i": 9, "line": 17, "section": 1, "kind": "sentence", "text": "私はこれを 1 週間動かし、自分の環境から外しました。", "mark": null}, {"i": 10, "line": 17, "section": 1, "kind": "sentence", "text": "539 回の提案のうち、提案した skill がその後に呼ばれたのは 28 回でした。", "mark": null}, {"i": 11, "line": 17, "section": 1, "kind": "sentence", "text": "次の一手を自分で決めるエージェントの中では、router が何を変えたのかを読み取れませんでした。", "mark": null}, {"i": 12, "line": 17, "section": 1, "kind": "sentence", "text": "その反省から作ったのが、コードがループを持ち、Jev は判定だけをする jev-research-pipeline です（後述）。", "mark": null}, {"i": 13, "line": 17, "section": 1, "kind": "sentence", "text": "この README には、ほかの Jev の実装に持ち出せる部品と、全体としてはここで効かなかった理由を残しています。", "mark": null}, {"i": 14, "line": 17, "section": 1, "kind": "sentence", "text": "経緯の全体は記事「「これ意味あるかな？", "mark": null}, {"i": 15, "line": 17, "section": 1, "kind": "sentence", "text": "」Claude Codeに入れたJevのプラグインを1週間で外すまで」（英語版）に書きました。", "mark": null}, {"i": 16, "line": 17, "section": 1, "kind": "sentence", "text": "Jev を使ったほかの実験は「著者のほかの仕事」にあります。", "mark": null}, {"i": 17, "line": 21, "section": 2, "kind": "sentence", "text": "この router のようなプロンプトごとの hook は、ターンに 1 行を足せますが、skill 一覧は変えられません。", "mark": null}, {"i": 18, "line": 21, "section": 2, "kind": "sentence", "text": "Claude Code は引き続き、全 skill の説明（description）を 1 本あたり 1,536 文字までモデルに見せ（skills の docs、2026-10-01 確認）、選ぶのはモデルです。", "mark": null}, {"i": 19, "line": 21, "section": 2, "kind": "sentence", "text": "router は、同じ説明をすでに読んでいる強いモデルに、より弱い判定器（Opus と比べた測定）が出す二つ目の意見になります。", "mark": null}, {"i": 20, "line": 21, "section": 2, "kind": "sentence", "text": "移植元の TypeSafe の skill suggestion cookbook（英語）は、違う条件で測られています。", "mark": null}, {"i": 21, "line": 21, "section": 2, "kind": "sentence", "text": "そのエージェントは `claude-haiku-4-5` で、見えていたのは skill 1 本あたり 60 文字に切られた索引だったので、全文を読める別の読み手が足せるものがありました。", "mark": null}, {"i": 22, "line": 23, "section": 2, "kind": "sentence", "text": "用意した依頼文ではうまくいき、実際のセッションではうまくいきませんでした。", "mark": null}, {"i": 23, "line": 23, "section": 2, "kind": "sentence", "text": "「この設計判断を ADR として記録したい」のような意図が 1 つの依頼文 6 件は、0.2.0 ですべて妥当な答えでした（2026-09-21）。", "mark": null}, {"i": 24, "line": 23, "section": 2, "kind": "sentence", "text": "そのあと 2026-09-21 から 2026-09-28 までの 1 週間、私自身の 52〜66 本の skill の名簿、`jev-1.13.0`、日本語のプロンプトで、shadow モードのまま動かしました。", "mark": null}, {"i": 25, "line": 31, "section": 2, "kind": "sentence", "text": "外したあとで、使われなかった提案から無作為に 20 件を選んで読みました。", "mark": null}, {"i": 26, "line": 31, "section": 2, "kind": "sentence", "text": "13 件は的外れで、そのうち少なくとも 6 件は、エージェントが書いた文（サブエージェントへの依頼や、サブエージェントからの報告）に反応していました。", "mark": null}, {"i": 27, "line": 31, "section": 2, "kind": "sentence", "text": "こうした文も、あなたが打つ発言と同じ入口から hook に届きます。", "mark": null}, {"i": 28, "line": 31, "section": 2, "kind": "sentence", "text": "5 件は話題は近いものの、skill の要らないターンでした。", "mark": null}, {"i": 29, "line": 31, "section": 2, "kind": "sentence", "text": "1 件は、Claude Code が skill を呼ばずにそのファイルを直接読んでいました。", "mark": null}, {"i": 30, "line": 31, "section": 2, "kind": "sentence", "text": "Claude Code の見落としだったかもしれないのは 1 件です。", "mark": null}, {"i": 31, "line": 31, "section": 2, "kind": "sentence", "text": "スクリプトと使ったオプション、数字の全体は evals/（英語）にあります。", "mark": null}, {"i": 32, "line": 33, "section": 2, "kind": "sentence", "text": "そこで止めた理由。", "mark": null}, {"i": 33, "line": 33, "section": 2, "kind": "sentence", "text": "28 という数には、Jev の選び方、Claude Code の次の一手の決め方、私の数え方の 3 つが混ざっています。", "mark": null}, {"i": 34, "line": 33, "section": 2, "kind": "sentence", "text": "次の一手を自分で決めるエージェントでは、1 行を足すだけでその後の動きが変わりえて、ログからはこの 3 つを分けられず、router が気づかないうちに性能を落としていないかも分かりません。", "mark": null}, {"i": 35, "line": 33, "section": 2, "kind": "sentence", "text": "手順をコードで固定したパイプラインなら、1 つの手順を Jev の判定に差し替えてもほかは変わらないので、その効果を読めます。", "mark": null}, {"i": 36, "line": 37, "section": 3, "kind": "sentence", "text": "jev-research-pipeline は、この router の最初の結果を受けて作り、使い続けている Jev の実装です。", "mark": null}, {"i": 37, "line": 37, "section": 3, "kind": "sentence", "text": "毎朝のリサーチを見張るパイプラインで、同じループを素の Python が毎回同じように回し、新しい論文やリポジトリが私の問いに答える助けになるかを Jev が判定し、LLM はノートを書く部分だけを担います。", "mark": null}, {"i": 38, "line": 37, "section": 3, "kind": "sentence", "text": "Jev の判定はループの決まった位置にあるので、どの判定を下し、その先で何が変わったかを見られます。", "mark": null}, {"i": 39, "line": 37, "section": 3, "kind": "sentence", "text": "この router が Claude Code の中では一度も見せられなかったものです。", "mark": null}, {"i": 40, "line": 37, "section": 3, "kind": "sentence", "text": "自分の実装のどこに Jev を置くかを考えているなら、2 つを並べて読んでください。", "mark": null}, {"i": 41, "line": 37, "section": 3, "kind": "sentence", "text": "部品と測り方はこのリポジトリに、効いた形はあちらにあります。", "mark": null}, {"i": 42, "line": 37, "section": 3, "kind": "sentence", "text": "経緯は記事「LLMに任せていたリサーチの判定を、判定専用モデルJevに移す」（英語版）に書きました。", "mark": null}, {"i": 43, "line": 41, "section": 4, "kind": "sentence", "text": "質問文と閾値は TypeSafe の cookbook から取っています。", "mark": null}, {"i": 44, "line": 41, "section": 4, "kind": "sentence", "text": "このリポジトリが足したのは、そのまわりの配管と、それを測る方法です。", "mark": null}, {"i": 45, "line": 41, "section": 4, "kind": "sentence", "text": "下の各行は、それぞれ自分の実装に持ち込める考え方を 1 つずつ指しています。", "mark": null}, {"i": 46, "line": 41, "section": 4, "kind": "sentence", "text": "出てくる Jev の質問の型は 2 つで、`choice` は一覧から 1 つを選び、`noul` は Yes/No の問いに確率で答えます。", "mark": null}, {"i": 47, "line": 54, "section": 5, "kind": "item", "text": "Wide（全体）。 1 回のリクエストで、名簿（インストール済みの skill）全体を、skill 名と説明の全文に対する `choice` で順位付けします。同じリクエストで、プロンプトそのものについて `noul` の質問を 3 つ尋ねます。ユーザーのシステムに対する操作か、専門家なら文書化された手順に従うか、文章だけで足りるか、の 3 つです。3 つ目の答えは、高いほど skill が要るという向きにそろえるため反転します。3 つの平均が gate で、0.30 未満ならここで止まり、2 回目のリクエストは使いません。", "mark": null}, {"i": 48, "line": 55, "section": 5, "kind": "item", "text": "Narrow（絞り込み）。 上位 3 件を、説明の全文と各 `SKILL.md` の本文全体つきで送り直します。Jev が `choice` で 1 本を選び、候補ごとに `noul` で 1 問答えます。「この skill は、頼まれた具体的なことをするか」です。この答えがその候補の適合度（fits）です。最も高い適合度が 0.30 未満なら、何も提案しません。そうでなければ Jev が選んだ 1 本を名指しします。ほかの候補の適合度のほうが高くても同じで、そのときはログの行に両方の名前が残ります。", "mark": null}, {"i": 49, "line": 57, "section": 5, "kind": "sentence", "text": "cookbook の「説明を 60 文字に切る」索引は引き継がず、何も切り詰めません。", "mark": null}, {"i": 50, "line": 57, "section": 5, "kind": "sentence", "text": "先頭だけで順位付けすると、Claude がすでに見ているものより少ない情報で判断することになるからです。", "mark": null}, {"i": 51, "line": 57, "section": 5, "kind": "sentence", "text": "名簿は、ユーザーの skill、有効になっているプラグインの skill、セッションの作業ディレクトリから git のルートまでにあるプロジェクトの skill から組み立てます。", "mark": null}, {"i": 52, "line": 57, "section": 5, "kind": "sentence", "text": "`disable-model-invocation: true` の skill は除きます。", "mark": null}, {"i": 53, "line": 61, "section": 6, "kind": "sentence", "text": "`off` 以外のモードでは、プロンプトごとに JSON を 1 行、プラグインのデータディレクトリにある `decisions.jsonl` へ追記します。", "mark": null}, {"i": 54, "line": 61, "section": 6, "kind": "sentence", "text": "次の行は `jev-1.13.0` に対する実際の呼び出し（`inject` モード）のものです。", "mark": null}, {"i": 55, "line": 61, "section": 6, "kind": "sentence", "text": "プロンプトは日本語で、設計判断を ADR として記録したい、という内容でした。", "mark": null}, {"i": 56, "line": 61, "section": 6, "kind": "sentence", "text": "`gate` は手順 1 の平均、`fits` は手順 2 の答えで、どちらも 0.30 を超えたので skill が名指しされました。", "mark": null}, {"i": 57, "line": 61, "section": 6, "kind": "sentence", "text": "行は一部を省略しています。", "mark": null}, {"i": 58, "line": 74, "section": 6, "kind": "sentence", "text": "`shadow` モードでは、この 1 行がすべてです。", "mark": null}, {"i": 59, "line": 74, "section": 6, "kind": "sentence", "text": "`inject` モードでは、cookbook の文言そのままの下のブロックもターンに足されます。", "mark": null}, {"i": 60, "line": 74, "section": 6, "kind": "sentence", "text": "どの skill も閾値を超えなければ、何も足しません。", "mark": null}, {"i": 61, "line": 84, "section": 7, "kind": "sentence", "text": "いまもインストールして動かせます。", "mark": null}, {"i": 62, "line": 84, "section": 7, "kind": "sentence", "text": "shadow モードで始め、evals/（英語）で自分のログを読んでから、Claude に伝えるかを決めてください。", "mark": null}, {"i": 63, "line": 91, "section": 7, "kind": "sentence", "text": "プラグインを有効にするとき、Claude Code が 3 つの設定を尋ねます。", "mark": null}, {"i": 64, "line": 91, "section": 7, "kind": "sentence", "text": "TypeSafe の API key（ここで作成。", "mark": null}, {"i": 65, "line": 91, "section": 7, "kind": "sentence", "text": "システムのキーチェーンに保存されます）、モード（既定は `shadow`）、任意のログの保存先です。", "mark": null}, {"i": 66, "line": 91, "section": 7, "kind": "sentence", "text": "モードの選択 UI には Claude Code 2.1.271 以上が必要です。", "mark": null}, {"i": 67, "line": 91, "section": 7, "kind": "sentence", "text": "それより古い版では、環境変数 `JEV_ROUTER` に `inject` か `off` を設定しない限り `shadow` のままです。", "mark": null}, {"i": 68, "line": 91, "section": 7, "kind": "sentence", "text": "key は環境変数 `TYPESAFE_API_KEY` で渡すことも、`~/.config/typesafe/api_key` に置くこともできます。", "mark": null}, {"i": 69, "line": 91, "section": 7, "kind": "sentence", "text": "`JEV_ROUTER=off` を設定すると、そのプロセスだけ hook が止まるので、無人で走るスクリプトを対象から外せます。", "mark": null}, {"i": 70, "line": 91, "section": 7, "kind": "sentence", "text": "プラグイン機構を使わずに配線するには、運用マニュアル（英語）を見てください。", "mark": null}, {"i": 71, "line": 93, "section": 7, "kind": "sentence", "text": "費用と待ち時間。", "mark": null}, {"i": 72, "line": 93, "section": 7, "kind": "sentence", "text": "判定のたびに 1〜2 リクエストを使い、名簿が 240 本を超えると 240 本ごとに 1 リクエスト増えます。", "mark": null}, {"i": 73, "line": 93, "section": 7, "kind": "sentence", "text": "0.2.0 で skill 52〜59 本の名簿の場合（2026-09-21）、gate で止まったときの入力は約 10,000 トークン、両方の手順が走ったときは 21,600〜25,300 トークンでした。", "mark": null}, {"i": 74, "line": 93, "section": 7, "kind": "sentence", "text": "現在の料金は TypeSafe の料金ページ（英語）で確認してください。", "mark": null}, {"i": 75, "line": 93, "section": 7, "kind": "sentence", "text": "shadow モードはターンを待たせません。", "mark": null}, {"i": 76, "line": 93, "section": 7, "kind": "sentence", "text": "`inject` モードは 3 秒の上限の中で答えを待ち、実際の判定 6 回は 0.7〜1.6 秒でした。", "mark": null}, {"i": 77, "line": 97, "section": 8, "kind": "sentence", "text": "判定のたびに `api.typesafe.ai` へ送られるのは、プロンプトの全文、名簿にある全 skill の名前と説明の全文、そして上位 3 件に限り、その `SKILL.md` の本文全体です。", "mark": null}, {"i": 78, "line": 97, "section": 8, "kind": "sentence", "text": "非公開のプロジェクトの `.claude/skills/` にある skill の本文も含みます。", "mark": null}, {"i": 79, "line": 97, "section": 8, "kind": "sentence", "text": "hook は会話の履歴もツールの出力も集めません。", "mark": null}, {"i": 80, "line": 97, "section": 8, "kind": "sentence", "text": "ただし、hook が読むプロンプトそのものが、サブエージェントの報告のようにエージェントが書いた文で、ツールの結果を引用していることがあります。", "mark": null}, {"i": 81, "line": 97, "section": 8, "kind": "sentence", "text": "プロンプトに貼り付けた秘密情報は、そのまま送られます。", "mark": null}, {"i": 82, "line": 97, "section": 8, "kind": "sentence", "text": "取り除く処理はありません。", "mark": null}, {"i": 83, "line": 99, "section": 8, "kind": "sentence", "text": "自分で書いたのではないリポジトリでは、`.claude/skills/` と、そこからリンクできるリポジトリ内のファイルも、判定のたびに送られうるものとして扱ってください。", "mark": null}, {"i": 84, "line": 99, "section": 8, "kind": "sentence", "text": "あなたが自分で置いて commit していない `.env` のようなファイルも含みます。", "mark": null}, {"i": 85, "line": 99, "section": 8, "kind": "sentence", "text": "あなた自身の `~/.claude/skills/` とプラグインの中では symlink の skill をたどりますが、プロジェクトの `SKILL.md` は、実体がそのリポジトリの中にある場合だけ読みます。", "mark": null}, {"i": 86, "line": 99, "section": 8, "kind": "sentence", "text": "プロジェクトの skill から手元のマシンのほかの場所へ張られたリンクが、読まれたり送られたりすることはありません。", "mark": null}, {"i": 87, "line": 99, "section": 8, "kind": "sentence", "text": "`TYPESAFE_BASE_URL` で key やプロンプトを別のホストへ向けることはできず、指定できるのはテストとローカルの代用サーバーのための loopback のアドレス（`localhost`、`127.0.0.1`、`::1`）だけです。", "mark": null}, {"i": 88, "line": 99, "section": 8, "kind": "sentence", "text": "`HTTPS_PROXY` のような標準のプロキシ変数は、ほかの Python の HTTPS クライアントと同じく効きます。", "mark": null}, {"i": 89, "line": 103, "section": 9, "kind": "item", "text": "閾値は cookbook の初期値です。ベンダーが英語の名簿と、より古いモデル版で測った値で、あなたの名簿や言語に合わせた較正はされていません。", "mark": null}, {"i": 90, "line": 104, "section": 9, "kind": "item", "text": "提案を注入すると何かが良くなる、という証拠を、このリポジトリは持っていません。", "mark": null}, {"i": 91, "line": 105, "section": 9, "kind": "item", "text": "ディスクに `SKILL.md` を持たない組み込みの skill と、`--add-dir` で追加したディレクトリ配下の skill は提案できません。`/` で始まるプロンプトと 4,000 文字を超えるプロンプトは対象外です。", "mark": null}, {"i": 92, "line": 106, "section": 9, "kind": "item", "text": "Jev に送れる入力は、1 リクエスト最大 64k トークン、プロンプトと最も長い質問の合計で 32k トークンです（TypeSafe の models ページ（英語）、2026-09-21 確認）。極端に長い `SKILL.md` が 3 本そろった場合や、名簿が大きい場合はこれを超えることがあり、そのターンは提案なしで通り、ログの行に理由が残ります。", "mark": null}, {"i": 93, "line": 108, "section": 9, "kind": "sentence", "text": "すべてのモード、設定、ログの欄、対象外になる条件は運用マニュアル（英語）にあります。", "mark": null}, {"i": 94, "line": 112, "section": 10, "kind": "item", "text": "手順の出所は TypeSafe の skill suggestion cookbook（英語）です。", "mark": null}, {"i": 95, "line": 113, "section": 10, "kind": "item", "text": "DECRUX9812/typesafe-skill-router は、同じ cookbook を Hermes Agent 向けに実装しています。その文書から 2 つの知見を借りました。1 つの質問は 255 択が上限であること、そして順位付けと候補ごとの適合判定が食い違う場合があることです。コードはコピーしていません。", "mark": null}, {"i": 96, "line": 114, "section": 10, "kind": "item", "text": "Claude Code 向けの router はほかにもあります。skillranker は、ローカルの履歴と較正を持つ Rust の CLI です。typesafe-mod は、同じプロンプトごとの順位付けを function hooks の mod として行い、この router と同じく一覧には触りません。", "mark": null}, {"i": 97, "line": 115, "section": 10, "kind": "item", "text": "1 行を足すのでなく、モデルに見せるもの自体を変える仕組みが、skill 自身の frontmatter（`disable-model-invocation` など）のほかに 2 つあり、このプロジェクトはどちらも使っていません。公式の設定 `skillOverrides` は、skill を「名前と説明」「名前だけ」「見せない」のどれで載せるかを決められます（skills の docs、2026-10-01 確認）。Claude Code の早期アクセス機能である function hooks（通称 mods、設計スレッド）は、モデルが見る前に一覧を書き換えられます。jev-skill-suggestion はこの 2 つを組み合わせ、一覧をモデルに読ませず、Jev に最大 1 本を選ばせて、その `SKILL.md` を添付します。私は試しておらず、効くかどうかは分かりません。", "mark": null}, {"i": 98, "line": 119, "section": 11, "kind": "sentence", "text": "Jev を使った実験は、どれも記事にしています（日本語は Zenn、英語は Dev.to）。", "mark": null}, {"i": 99, "line": 119, "section": 11, "kind": "sentence", "text": "このリポジトリについての記事は 2 本です。", "mark": null}, {"i": 100, "line": 121, "section": 11, "kind": "item", "text": "「JevのスキルルーターをClaude Codeに足して、スキル一覧を書き換える手前で引き返した」（英語版）。作る話です。プロンプトの hook で何が変えられたか、どこで引き返したか、判定モデルを自分のハーネスに足す前に確かめる 3 つのことを書きました。", "mark": null}, {"i": 101, "line": 122, "section": 11, "kind": "item", "text": "「「これ意味あるかな？」Claude Codeに入れたJevのプラグインを1週間で外すまで」（英語版）。動かした話です。この router と、完了を止めるプラグインの 1 週間、2 つとも外した理由、判定モデルの効果が固定したパイプラインでは読めてエージェントのループでは読めない理由を書きました。", "mark": null}, {"i": 102, "line": 124, "section": 11, "kind": "sentence", "text": "Jev が効いた場所と、どこまで押し広げられるか:", "mark": null}, {"i": 103, "line": 126, "section": 11, "kind": "item", "text": "「LLMに任せていたリサーチの判定を、判定専用モデルJevに移す」（英語版）。上で紹介した対になる実装、jev-research-pipeline の経緯です。", "mark": null}, {"i": 104, "line": 127, "section": 11, "kind": "item", "text": "「文章を書かないモデルJevのスキル選択は、0.3秒でOpusにどこまで近づくか」（英語版）。同じ 150 件の状況で、Jev と Claude Opus に skill を選ばせて比べました。Jev と Opus の一致は、Opus 同士の一致の約半分で、費用は約 560 分の 1 でした。", "mark": null}, {"i": 105, "line": 128, "section": 11, "kind": "item", "text": "「Jevの判断をローカルで再現するには何が要るか」（英語版）。手元で動く 4 つのモデルに同じ 150 件を解かせ、4 つとも、それぞれ別の理由で Jev の水準に届きませんでした。", "mark": null}, {"i": 106, "line": 130, "section": 11, "kind": "sentence", "text": "エージェントの作り方、エージェントが失敗したとき誰が責任を持つか、AI 時代の著者性といった、私のほかの仕事の入口は github.com/shimo4228 です。", "mark": null}, {"i": 107, "line": 130, "section": 11, "kind": "sentence", "text": "新しい実験は、まずそこに並びます。", "mark": null}, {"i": 108, "line": 130, "section": 11, "kind": "sentence", "text": "この router を測った名簿の大半を占める、私が書いた skill は claude-harness で公開しています。", "mark": null}, {"i": 109, "line": 130, "section": 11, "kind": "sentence", "text": "記事の一覧は Zenn（日本語）と Dev.to（英語）にあります。", "mark": null}, {"i": 110, "line": 134, "section": 12, "kind": "sentence", "text": "このプロジェクトは TypeSafe AI とは無関係です。", "mark": null}, {"i": 111, "line": 134, "section": 12, "kind": "sentence", "text": "コードは、私の指示のもとで Claude Code が書きました。", "mark": null}, {"i": 112, "line": 134, "section": 12, "kind": "sentence", "text": "オフラインのテスト（`uv run pytest -q`、ネットワーク不要）で検査しています。", "mark": null}, {"i": 113, "line": 134, "section": 12, "kind": "sentence", "text": "key とプロンプトが通る経路は、自動のレビュー（LLM の security review エージェントと、Claude Code 組み込みの code review）にかけました。", "mark": null}, {"i": 114, "line": 134, "section": 12, "kind": "sentence", "text": "その結果、HTTP リダイレクト時の key の漏えいと、信頼できない文字列がモデルの文脈に届く経路が見つかり、修正しています。", "mark": null}, {"i": 115, "line": 134, "section": 12, "kind": "sentence", "text": "第三者の人間による監査は受けていません。", "mark": null}, {"i": 116, "line": 138, "section": 13, "kind": "item", "text": "運用マニュアル（英語）: すべてのモード、設定、ログの欄、対象外になる条件", "mark": null}, {"i": 117, "line": 139, "section": 13, "kind": "item", "text": "Evals（英語）: ログとセッション記録を突き合わせるスクリプトと、私の 1 週間の数字", "mark": null}, {"i": 118, "line": 140, "section": 13, "kind": "item", "text": "変更履歴（英語）", "mark": null}, {"i": 119, "line": 141, "section": 13, "kind": "item", "text": "ライセンス: MIT", "mark": null}]}]</script>
<script>
const TEXTS = JSON.parse(document.getElementById("data").textContent);
const NEXT = { null: "skip", skip: "stop", stop: null };
const LABEL = { skip: "要らない", stop: "止まった" };
const state = {}; // text_id -> {i: mark}
let current = TEXTS[0].text_id;
let db = null;
let ready = false; // clicks wait for the stored marks, or a click would overwrite them
const timers = {};
const $ = (id) => document.getElementById(id);

function setStatus(t) { $("status").textContent = t; }
function textOf(id) { return TEXTS.find((t) => t.text_id === id); }

function renderTabs() {
  $("tabs").replaceChildren(...TEXTS.map((t) => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab";
    b.textContent = t.text_id;
    b.setAttribute("aria-selected", String(t.text_id === current));
    b.onclick = () => { current = t.text_id; render(); window.scrollTo(0, 0); };
    return b;
  }));
}

function renderCount() {
  const marks = Object.values(state[current] || {});
  const n = textOf(current).units.length;
  const skip = marks.filter((m) => m === "skip").length;
  const stop = marks.filter((m) => m === "stop").length;
  $("count").textContent = `${n} 文 · 要らない ${skip} · 止まった ${stop}`;
}

function paint(btn, mark) {
  btn.dataset.mark = mark || "";
  btn.querySelector(".tag")?.remove();
  if (mark) {
    const s = document.createElement("span");
    s.className = "tag"; s.textContent = LABEL[mark];
    btn.append(s);
  }
}

function render() {
  renderTabs();
  const t = textOf(current);
  const marks = state[current] || {};
  const nodes = [];
  let sec = -1;
  for (const u of t.units) {
    if (u.section !== sec) {
      sec = u.section;
      const d = document.createElement("div");
      d.className = "sec"; d.textContent = `§${sec}`;
      nodes.push(d);
    }
    const b = document.createElement("button");
    b.className = "u" + (u.kind === "item" ? " item" : "");
    b.textContent = u.text;
    paint(b, marks[u.i] || null);
    b.onclick = () => toggle(u.i, b);
    nodes.push(b);
  }
  $("list").replaceChildren(...nodes);
  renderCount();
}

function toggle(i, btn) {
  if (!ready) return;
  const marks = (state[current] ||= {});
  const next = NEXT[marks[i] || null];
  if (next) marks[i] = next; else delete marks[i];
  paint(btn, next);
  renderCount();
  scheduleSave(current);
}

function scheduleSave(id) {
  if (!db) { setStatus("保存できません（db なし）"); return; }
  setStatus("未保存");
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => save(id), 1200);
}

let saving = Promise.resolve();
function save(id) {
  saving = saving.then(async () => {
    setStatus("保存中…");
    try {
      await db.doc(`marks/${id}`).set({ sha256: textOf(id).sha256, marks: { ...state[id] } });
      setStatus("保存済み");
    } catch (e) {
      setStatus(e && e.code === "invalid_argument" ? "保存できません（書き込み権限なし）" : "保存に失敗。もう一度押すと再保存します");
    }
  });
}

async function load(db) {
  const warns = [];
  for (const t of TEXTS) {
    const snap = await db.doc(`marks/${t.text_id}`).get();
    if (!snap.exists) continue;
    const d = snap.data();
    if (d.sha256 !== t.sha256) { warns.push(t.text_id); continue; }
    state[t.text_id] = { ...(d.marks || {}) };
  }
  if (warns.length) {
    const w = document.createElement("div");
    w.className = "warn";
    w.textContent = `本文の版が変わったため、前の印を読み込んでいません: ${warns.join(", ")}`;
    $("warn").replaceChildren(w);
  }
}

document.body.classList.add("loading");
render();
(async () => {
  const d = await window.claude?.use?.("db") ?? null;
  if (!d) { setStatus("db が使えないため、印を付けられません"); return; }
  try { await load(d); } catch { setStatus("読み込みに失敗。開き直してください"); return; }
  db = d; ready = true;
  document.body.classList.remove("loading");
  setStatus("保存済み");
  render();
})();
</script>
