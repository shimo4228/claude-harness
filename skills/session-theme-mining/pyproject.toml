[project]
name = "session-theme-mining"
version = "0.1.0"
description = "Deterministic transcript catalog for the session-theme-mining skill"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1.0",
  "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--cov=scripts", "--cov-report=term-missing", "--cov-fail-under=80"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI and cache integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/session_catalog.py" = ["T201"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["scripts"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
