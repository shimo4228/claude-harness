[project]
name = "detail-units"
version = "0.1.0"
description = "Schema check for the detail-units skill's eval/units.yaml. PyYAML only; pytest is a dev dependency."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Same explicit select as the harness root ruff.toml, so upstream default changes do not move the gate.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are not consumed boundaries. Type enforcement applies to production code only.
"tests/test_*.py" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15
