[project]
name = "learn-eval"
version = "0.1.0"
description = "Overlap-candidate enumeration for a learn-eval draft (installed skills + MEMORY.md index lines). Mechanical half of the code/LLM split; the Save/Improve/Absorb/Drop verdict stays with the skill."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
