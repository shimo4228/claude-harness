[project]
name = "review-when-watch"
version = "0.1.0"
description = "Daily launchd job: asks TypeSafe Jev whether each new jev-research-pipeline note satisfies the review-when condition of an RFC or ADR in this harness, and posts the hits to Slack."
requires-python = ">=3.11"
# runtime は stdlib のみ。Jev の HTTP クライアントは
# skills/jev-skill-router/scripts/jev_client.py をファイルパスで読み込んで使う (scripts/judge.py)。
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-markers",
  "--cov=scripts",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する。無指定だと ruff の版更新でゲートの判定が
# 動く — 検査の閾値は harness 側が所有する (根拠は root ruff.toml の冒頭コメント)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.isort]
# root ruff.toml と同じく `scripts` を first-party に固定する (jev-skill-router の注記と同じ理由)。
known-first-party = ["scripts"]

[tool.ruff.lint.per-file-ignores]
# テスト関数は消費される境界ではない。型強制は production 側のみ
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
