[project]
name = "skill-health"
version = "0.1.0"
description = "Harness skill-library structural debt scanner (deterministic, structural-only). Detects 'missing artifacts' debt — references in a SKILL.md to scripts, bash files, agents, or sibling skills that do not resolve on disk. Semantic, risk, and validation dimensions are delegated to skill-stocktake / the claude-security plugin / skill-comply per the Agent Knowledge Cycle Curate phase. Debt taxonomy from SkillOps (arXiv:2605.13716)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI / end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する。無指定だと ruff の既定 (0.16 で 413 rule)
# が効き、ゲートの判定が上流の版更新で動く — 検査の閾値は harness 側が所有する
# (根拠は root ruff.toml の冒頭コメント。citation-sync が 2026-08 に同じ pin を先行導入)。
# C901 の閾値は root と同じ 15。予算は **上げずに刈る** (ADR-0056、正本は .claude/verify.md)。
# ANN 系は境界の明示型強制 (2026-08-31、根拠と設計制約は ~/.claude/.claude/verify.md)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# テスト関数は消費される境界ではない。型強制は production 側のみ
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# テストは fake の呼び出し順を関数へ属性で括り付ける (`fetch.calls = calls`)。関数への
# 動的属性は checker がモデル化できないが、production コードは一切していない。
# 2026-08-28、ty 0.0.75 導入時。解除条件: fake を小さなクラスへ置き換えたとき。
unresolved-attribute = "ignore"
