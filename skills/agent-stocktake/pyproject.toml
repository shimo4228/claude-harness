[project]
name = "agent-stocktake"
version = "0.1.0"
description = "Deterministic evidence for agent-definition stocktake (name/stem, tools registry, description near-duplicates, suppression candidates). Mechanical half of the code/LLM split; the verdicts stay with the agent-stocktake skill."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
