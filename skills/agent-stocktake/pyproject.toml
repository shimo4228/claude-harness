[project]
name = "agent-stocktake"
version = "0.1.0"
description = "Deterministic evidence for agent-definition stocktake (name/stem, tools registry, description near-duplicates, suppression candidates). Mechanical half of the code/LLM split; the verdicts stay with the agent-stocktake skill."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the same explicit select as the root ruff.toml. Without it, ruff's defaults (413 rules in 0.16)
# apply and the gate's verdicts shift with upstream version bumps — the harness owns the check
# thresholds (rationale in the header comment of root ruff.toml; citation-sync introduced the same pin first, 2026-08).
# The C901 threshold is 15, same as root. The budget is **trimmed, never raised** (ADR-0056; canonical in .claude/verify.md).
# The ANN rules enforce explicit types at boundaries (2026-08-31; rationale and design constraints in ~/.claude/.claude/verify.md).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are not consumed boundaries. Type enforcement applies to production code only
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# `collect_evidence` and friends return `dict | None`, and the tests subscript them knowing the fixture
# never yields None. Adding narrowing to every assert would bury what the tests assert, so this is
# downgraded **for tests only**. Production code keeps the default error.
# 2026-08-28, when ty 0.0.75 was introduced. Lift when: the target APIs no longer return Optional.
not-subscriptable = "ignore"
