[project]
name = "agent-stocktake"
version = "0.1.0"
description = "Deterministic evidence for agent-definition stocktake (name/stem, tools registry, description near-duplicates, suppression candidates). Mechanical half of the code/LLM split; the verdicts stay with the agent-stocktake skill."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する。無指定だと ruff の既定 (0.16 で 413 rule)
# が効き、ゲートの判定が上流の版更新で動く — 検査の閾値は harness 側が所有する
# (根拠は root ruff.toml の冒頭コメント。citation-sync が 2026-08 に同じ pin を先行導入)。
# C901 の閾値は root と同じ 15。予算は **上げずに刈る** (ADR-0056、正本は .claude/verify.md)。
# ANN 系は境界の明示型強制 (2026-08-31、根拠と設計制約は ~/.claude/.claude/verify.md)。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# テスト関数は消費される境界ではない。型強制は production 側のみ
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# `collect_evidence` 等は `dict | None` を返し、テストは fixture が None にならないことを
# 知った上で添字を書いている。narrowing を全 assert に足すとテストの主張が埋もれるので、
# **テストに限って** 降格する。production コード側は既定の error のまま。
# 2026-08-28、ty 0.0.75 導入時。解除条件: 対象 API が Optional を返さなくなったとき。
not-subscriptable = "ignore"
