[project]
name = "growth-fable"
version = "0.1.0"
description = "Deterministic GitHub growth snapshot collector for the Astra–Fable growth loop. Reads the hub repo's traffic JSONL (existing daily GitHub Actions collector) plus live gh api reads (followers, stars with starred_at velocity, referrers, code-search mentions) and writes .growth/SNAPSHOT.json. Observations only — no interpretation, no fabricated fields (unavailable → null + errors[])."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
  "unit: fast pure-python unit tests",
  "integration: CLI / end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# root ruff.toml と同じ明示 select を pin する（根拠は root ruff.toml 冒頭コメント / ADR-0056）
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C901", "ANN001", "ANN002", "ANN003", "ANN201", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
